  </fieldset>
  <fieldset class="sites"><legend>Your selling sites</legend>
    ${PKEYS.map(k=>`<label><input type="checkbox" data-site="${k}" ${activeKeys().includes(k)?'checked':''}> <span><b>${PLATFORMS[k].name}</b> <span class="hint">\u00b7 ${POST_MODES[PLATFORMS[k].mode].short}</span></span></label>`).join('')}
    <p class="note">Only checked sites show on items and in price comparisons. Bot sites aren\u2019t connected yet \u2014 you can post those yourself too.</p>
  </fieldset>
  <fieldset><legend>Export</legend>
    <button class="btn primary block" id="expJson">\u2b07 Full backup (JSON, with photos)</button>

    <button class="btn block" id="expCsv" style="margin-top:12px">\u2b07 Inventory spreadsheet (CSV, no photos)</button>
  </fieldset>
  <fieldset><legend>Import</legend>
    <label class="btn block pick">\u2b06 Restore from JSON backup<input type="file" accept="application/json,.json" id="impJson"></label>
    <p class="note">Merges into current inventory; items with the same ID are replaced.</p>
    <label class="btn block pick" style="margin-top:12px">\u2b06 Import comps by SKU (JSON)<input type="file" accept="application/json,.json" id="impComps"></label>
    <p class="note">Format: <code>{"V-0001": {"ebay": {"low":20,"median":35,"high":60,"count":12}}}</code></p>
  </fieldset>
  <fieldset><legend>Storage</legend><p class="note" id="storeInfo">Checking\u2026</p>
    <p class="note">Tip: on iPhone, Share \u2192 \u201cAdd to Home Screen\u201d so Safari is less likely to clear data, and back up weekly.</p></fieldset>
  <fieldset class="about" id="about"><legend>About</legend>
    <a class="btn primary block" id="siteLink" href="${SITE_URL}"${siteLinkAttrs()}>\ud83c\udf10 ${esc(APP_NAME)} website \u2197</a>
    <p class="note" style="text-align:center">hangerhustle.com \u2014 what the app does, how to install it, help</p>
    <div class="pbtns"><a class="btn sm" id="apkLink" href="${SITE_APK_URL}"${siteLinkAttrs()}>\ud83d\udcf1 Android app download</a><a class="btn sm" id="helpLink" href="${SITE_HELP_URL}"${siteLinkAttrs()}>\u2753 Help &amp; FAQ</a></div>
    <p class="note">This app lives at <b>app.hangerhustle.com</b>; the website is <b>hangerhustle.com</b>. You can also tap the small \u24d8 next to the name on the Inventory screen.</p>
  </fieldset>
  <p class="foot"><a href="privacy.html">Privacy</a> \u00b7 <a href="terms.html">Terms</a> \u00b7 <a href="${SITE_URL}"${siteLinkAttrs()}>Website</a> \u00b7 ${esc(APP_NAME)}</p>`;
  $('#expJson').onclick=exportJSON; $('#expCsv').onclick=exportCSV;
  $('#impJson').onchange=importJSON; $('#impComps').onchange=importComps;
  bindGoogleSection();
  $$('[data-site]').forEach(c=>c.onchange=()=>{ setSiteOn(c.dataset.site,c.checked); toast(`${PLATFORMS[c.dataset.site].name} ${c.checked?'shown':'hidden'}`); });
  (async()=>{ let s=`${ITEMS.length} items.`; try{ if(navigator.storage?.estimate){ const e=await navigator.storage.estimate(); s+=` Using ~${(e.usage/1048576).toFixed(1)} MB.`; } if(navigator.storage?.persisted) s+=(await navigator.storage.persisted())?' Storage is persistent \u2713':' Storage not marked persistent (browser may clear it if space runs low).'; }catch(e){} $('#storeInfo').textContent=s; })();

const stamp=()=>new Date().toISOString().slice(0,10);
const slug=APP_NAME.toLowerCase().replace(/[^a-z0-9]+/g,'-');
async function buildBackupBlob(){
  const photos=await getAllPhotos(), parts=[];
  const head=JSON.stringify({app:APP_NAME,format:'closet-to-cash-backup',version:1,exportedAt:new Date().toISOString(),skuCounter:(await getMeta('sku'))||0,...(ACCT.updatedAt?{accounts:acctSnapshot()}:{}),items:ITEMS});
  parts.push(head.slice(0,-1)+',"photos":[');
  for(let i=0;i<photos.length;i++){ const p=photos[i]; parts.push((i?',':'')+JSON.stringify({id:p.id,itemId:p.itemId,idx:p.idx,data:await blobToDataURL(photoBlob(p))})); }
  parts.push(']}');
  return {blob:new Blob(parts,{type:'application/json'}),photoCount:photos.length};
}
async function exportJSON(){
  toast('Preparing backup\u2026');
  const {blob,photoCount}=await buildBackupBlob();
  downloadBlob(blob,`${slug}-backup-${stamp()}.json`);
  toast(`Backup saved: ${ITEMS.length} items, ${photoCount} photos`);
}
function buildCSV(){
  const cols=['sku','brand','type','era','size','color','material','keywords','pit','length','waist','inseam','condition','flaws','cost','price','soldPrice'];
  const head=[...cols,...PKEYS.flatMap(p=>[p+'_status',p+'_url']),'created'];
  const cell=v=>{ v=v==null?'':String(v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const rows=ITEMS.slice().sort((a,b)=>a.createdAt-b.createdAt).map(it=>[...cols.map(c=>c==='condition'?condLabel(it.condition):c==='soldPrice'?(st(it).sold?soldPrice(it):''):it[c]),
    ...PKEYS.flatMap(p=>[it.status?.[p]?.state||'none',it.status?.[p]?.url||'']), new Date(it.createdAt).toISOString()].map(cell).join(','));
  return '\ufeff'+[head.join(','),...rows].join('\r\n');
}
function exportCSV(){ downloadBlob(new Blob([buildCSV()],{type:'text/csv'}),`${slug}-inventory-${stamp()}.csv`); toast('CSV exported'); }
async function importJSON(e){
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const d=JSON.parse(await f.text());
    if(!d||!Array.isArray(d.items)) throw new Error('Not a backup file');
    const accNew=!!d.accounts&&migrateAccounts(d.accounts).updatedAt>ACCT.updatedAt;   // old backups have no accounts: keep this phone's
    if(!confirm(`Import ${d.items.length} items and ${(d.photos||[]).length} photos${accNew?' (and your My accounts list)':''} into this device?`)) return;
    if(accNew){ await applyAccounts(d.accounts); markDirty(); }
    const tb=(await getMeta('tombstones'))||{}; for(const it of d.items){ if(it.id) delete tb[it.id]; } await setMeta('tombstones',tb);
    for(const it of d.items){ if(!it.id) continue; migrateItem(it); if(it.comps) try{ it.comps=normalizeComps(it.comps); }catch(_){ it.comps={}; } await putItem(it); }
    for(const p of (d.photos||[])){ if(!p.id||!p.data) continue; const {buf,type}=dataURLToBuf(p.data); await putPhoto({id:p.id,itemId:p.itemId,idx:p.idx||0,type,buf}); }
    let maxN=d.skuCounter||0; d.items.forEach(it=>{ const m=String(it.sku||'').match(/(\d+)$/); if(m) maxN=Math.max(maxN,+m[1]); });
    if(maxN>((await getMeta('sku'))||0)) await setMeta('sku',maxN);
    await refresh(); toast(`Imported ${d.items.length} items`); location.hash='#/'; route();
  }catch(err){ toast('Import failed: '+err.message); }
}
async function importComps(e){
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const d=JSON.parse(await f.text()); let n=0; const miss=[];
    for(const sku of Object.keys(d)){ const it=ITEMS.find(i=>i.sku===sku); if(!it){ miss.push(sku); continue; } it.comps={...(it.comps||{}),...normalizeComps(d[sku])}; it.compsUpdatedAt=Date.now(); await putItem(it); n++; }
    await refresh(); toast(`Comps updated for ${n} item(s)${miss.length?` \u00b7 not found: ${miss.slice(0,3).join(', ')}`:''}`);
  }catch(err){ toast('Import failed: '+err.message); }
}

/* ---------- home-screen icon (PNG generated at runtime; iOS ignores SVG touch icons) ---------- */
function addTouchIcon(){
  try{
    const c=document.createElement('canvas'); c.width=c.height=180; const x=c.getContext('2d');
    x.fillStyle='#7a3a26'; x.fillRect(0,0,180,180);
    x.strokeStyle='#f6efe3'; x.lineWidth=9; x.lineCap='round'; x.lineJoin='round';
    x.beginPath(); x.arc(90,52,16,Math.PI*0.95,Math.PI*0.5,false); x.lineTo(90,82); x.lineTo(148,124); x.lineTo(32,124); x.closePath(); x.stroke();
    x.fillStyle='#c48f2c'; x.font='bold 34px Georgia,serif'; x.textAlign='center'; x.fillText('$',90,164);
    const l=document.createElement('link'); l.rel='apple-touch-icon'; l.href=c.toDataURL('image/png'); document.head.appendChild(l);
  }catch(e){}
}

/* HH-Closets migration: once per device, bring every stored item to schema 2 (status for every site, legacy states mapped).
   updatedAt is NOT bumped, so a Drive copy never loses to a migration-only change; restore/import migrate on the way in. */
async function migrateAll(){ let n=0;
  for(const it of ITEMS){ if((it.schema||0)>=ITEM_SCHEMA) continue; migrateItem(it); await reqP(os('items','readwrite').put(it)); n++; }
  if(n){ await refresh(); try{ await setMeta('migratedSchema2',{at:Date.now(),items:n}); }catch(e){} }
  return n; }
/* ---------- boot ---------- */
(async function init(){
  document.title=APP_NAME;
  const m=document.querySelector('meta[name="apple-mobile-web-app-title"]'); if(m) m.content=APP_NAME;
  if(location.protocol==='file:') addTouchIcon();   // hosted copy uses icon-180.png instead
  else {
    // Web app manifest + service worker only work over http(s) (e.g. GitHub Pages), not file://
    const l=document.createElement('link'); l.rel='manifest'; l.href='manifest.webmanifest'; document.head.appendChild(l);
    if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(e=>console.warn('SW registration failed',e)));
  }
  try{ db=await openDB(); await refresh(); await migrateAll(); await loadAccounts(); }
  catch(err){ $('#app').innerHTML=`<div class="empty"><h2>Storage unavailable</h2><p>${esc(err.message)}. Private browsing or some file previewers block storage \u2014 open this page in Safari/Chrome normally.</p></div>`; return; }
  Auth.load();
  try{ SYNC.last=(await getMeta('lastBackup'))||null; }catch(e){}
  document.addEventListener('visibilitychange',flushOnHide); window.addEventListener('pagehide',()=>{ if(SYNC.dirty&&autoBackupOn()) backupNow({reason:'hide'}); });
  window.addEventListener('online',()=>{ if(SYNC.dirty&&autoBackupOn()) markDirty(); });
  window.addEventListener('hashchange',route);
  route();
})();
</script>
