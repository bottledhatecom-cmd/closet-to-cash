<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hanger Hustle</title>
<meta name="theme-color" content="#7a3a26">
<meta name="description" content="Offline vintage clothing inventory and cross-listing helper">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hanger Hustle">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237a3a26'/%3E%3Cpath d='M32 14a6 6 0 0 1 6 6c0 3-2 4-4 5l-2 1v3l20 14c2 1 1 4-1 4H13c-2 0-3-3-1-4l20-14' fill='none' stroke='%23f7efe1' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!--
  Hanger Hustle - single-file, offline vintage inventory + cross-listing helper.

  HONEST NOTE ON WHAT THIS DOES / DOESN'T DO:
  - It does NOT post listings by itself. Posting plan (2026-10-21): a separate bot will post to eBay and
    Etsy via their official APIs and to Depop via its Selling API (Depop's Terms allow crosslisting tools);
    Poshmark, Mercari, Vinted, FB Marketplace and Grailed ban bots, so she publishes those herself from a
    pre-filled listing ("Post to ..." button). The bot is not built yet; "Queue for bot" only marks items.
  - What it DOES: stores your items + photos on THIS device (IndexedDB), generates platform-tailored
    titles/descriptions you copy-paste, lets you push photos to the marketplace app via the share
    sheet, and tracks where each item is listed/sold so you remember to delist.
  - Optional Google sign-in backs up to the user's OWN Drive (hidden appDataFolder) - still no backend.
  - Hosted copy (GitHub Pages) adds manifest.webmanifest + sw.js so it installs and opens offline.
  - Data lives only in this browser on this device. Use Backup > "Full backup (JSON)" regularly.
  - Fee defaults and character limits are approximations as of 2026 and change; edit them below.
  - Comp prices are entered/pasted by you; nothing is scraped. "Search sold comps" just opens
    each site's search page in a new tab.
-->
<style>
:root{
  --cream:#f6efe3; --paper:#fffaf2; --ink:#2d2420; --muted:#7a6a5f; --line:#e4d6c3;
  --rust:#a24c2c; --deep:#7a3a26; --sage:#5f7a5a; --sage-bg:#e6eee1; --mustard:#c48f2c;
  --red:#b3261e; --red-bg:#fde8e4; --gold-bg:#fbf1d9;
  --radius:16px; --tap:48px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.45 var(--sans)}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));
  background-image:radial-gradient(rgba(122,58,38,.05) 1px,transparent 1px);background-size:14px 14px}
a{color:var(--deep)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.2px;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
.top{padding:calc(14px + env(safe-area-inset-top)) 0 6px;text-align:center}
.top h1{font-size:30px;color:var(--deep)}
.top .tag{margin:2px 0 0;color:var(--muted);font-family:var(--serif);font-style:italic;font-size:14px}
.ornament{display:block;margin:6px auto 0;width:120px;height:8px;color:var(--mustard)}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;justify-content:space-between;
  padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:rgba(246,239,227,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);margin:0 -14px 12px}
.bar .ttl{font-family:var(--serif);font-weight:600;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;
  min-height:var(--tap);padding:0 18px;font:600 15px var(--sans);display:inline-flex;align-items:center;justify-content:center;
  gap:6px;text-decoration:none;cursor:pointer;touch-action:manipulation;text-align:center}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--deep);border-color:var(--deep);color:#fff}
.btn.rust{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:42px;padding:0 14px;font-size:14px}
.btn.danger{color:var(--red);border-color:#e9b8b2}
.btn.block{width:100%}
.btn[disabled]{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font:700 20px var(--serif);color:var(--deep)}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
@media (min-width:560px){.stats{grid-template-columns:repeat(5,1fr)}}
.alert{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--red-bg);color:var(--red);
  border:1.5px solid #f0b4aa;border-radius:14px;padding:12px 14px;font:600 15px var(--sans);margin:10px 0}
.alert .x{font-size:20px;line-height:1}
.alert small{display:block;font-weight:500;color:#7d2a22}
.search{width:100%;min-height:var(--tap);border-radius:999px;border:1px solid var(--line);background:var(--paper);padding:0 18px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);
  font:600 14px var(--sans);color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.warn.on{background:var(--red);border-color:var(--red)}
.row{display:flex;gap:8px;align-items:center}
.row.between{justify-content:space-between}
select,input,textarea{font:16px var(--sans);color:var(--ink)}
.sel{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);padding:0 10px}
.items{display:grid;gap:12px;margin:12px 0 20px}
.items.grid{grid-template-columns:repeat(2,1fr)}
@media (min-width:600px){.items.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;display:block;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  text-decoration:none;color:inherit;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.card .thumb{aspect-ratio:4/5;background:#efe4d4;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .ci{padding:8px 10px 10px}
.sku{font:600 11px var(--sans);letter-spacing:1px;color:var(--muted)}
.card .t{font-weight:600;font-size:14px;line-height:1.3;margin:2px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font:700 17px var(--serif);color:var(--deep)}
.pchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pc{font:700 10.5px var(--sans);padding:3px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted);background:#fff}
.pc.listed{background:var(--sage-bg);border-color:#b9cdb2;color:#35502f}
.pc.sold{background:var(--rust);border-color:var(--rust);color:#fff}
.pc.delist{background:var(--red-bg);border-color:#f0b4aa;color:var(--red);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(179,38,30,.15)}}
.ribbon{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font:700 11px var(--sans);padding:4px 8px;border-radius:8px;letter-spacing:.5px;z-index:1}
.ribbon.sold{background:var(--rust)}
.items.list .card{display:flex}
.items.list .card .thumb{width:96px;flex:0 0 96px;aspect-ratio:auto;min-height:110px}
.items.list .card .ci{flex:1;min-width:0}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty h2{color:var(--deep);margin-bottom:6px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,250,242,.97);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
.nav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font:600 12px var(--sans);min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav a.on{color:var(--deep)}
.nav a .i{font-size:20px;line-height:1}
.nav a.add{flex:0 0 auto}
.nav a.add .plus{width:58px;height:58px;border-radius:50%;background:var(--deep);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(122,58,38,.35);margin-top:-26px}
fieldset{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);margin:0 0 14px;padding:12px 14px 14px;min-width:0}
legend{font:600 16px var(--serif);color:var(--deep);padding:0 6px}
.f{display:block;margin:10px 0 0}
.f>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea,.inp{width:100%;min-height:var(--tap);border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px}
.f textarea,textarea.inp{min-height:84px;resize:vertical;line-height:1.4}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#efe4d4}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;border:0;border-radius:999px;width:36px;height:36px;font-size:16px;background:rgba(0,0,0,.6);color:#fff}
.ph .rm{top:4px;right:4px}.ph .cv{bottom:4px;left:4px}
.ph .badge{position:absolute;bottom:6px;right:6px;background:var(--mustard);color:#fff;font:700 10px var(--sans);padding:2px 6px;border-radius:6px}
.pickers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{position:relative;overflow:hidden}
.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.sticky-save{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));padding:10px 0;background:linear-gradient(transparent,var(--cream) 35%)}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:0 14px 6px}
.gallery img{height:300px;max-width:80vw;object-fit:cover;border-radius:14px;scroll-snap-align:start;flex:0 0 auto;background:#efe4d4}
.nophoto{height:160px;border-radius:14px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);width:100%}
.summary{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:12px 0}
.summary h2{font-size:21px;line-height:1.25}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-top:10px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.sec{font-size:20px;color:var(--deep);margin:22px 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 14px;border-top:5px solid var(--pc,#999)}
.pcard.is-delist{border-color:#f0b4aa;background:#fff6f4;box-shadow:0 0 0 3px rgba(179,38,30,.12)}
.pcard .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pcard h3{font-size:19px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;min-height:42px;padding:0 12px;font:600 13px var(--sans);color:var(--muted)}
.seg button.on[data-s=none]{background:#eee6da;color:var(--ink)}
.seg button.on[data-s=listed]{background:var(--sage);color:#fff}
.seg button.on[data-s=sold]{background:var(--rust);color:#fff}
.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 4px}
.cnt{font:600 12px var(--sans);color:var(--sage);white-space:nowrap}
.cnt.over{color:var(--red)}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;transition:.25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.comps{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:14px}
.ctable{width:100%;border-collapse:collapse;font-size:13px}
.ctable th{font:600 10.5px var(--sans);text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.ctable th:first-child,.ctable td:first-child{text-align:left}
.ctable td{text-align:right;padding:8px 4px;border-bottom:1px solid #f0e6d8;white-space:nowrap}
.ctable tr.best td{background:var(--gold-bg);font-weight:700}
.ctable tr.best td:first-child::before{content:"\2605 ";color:var(--mustard)}
.ctable td:first-child{white-space:normal}
.suggest{display:flex;gap:10px;align-items:center;background:var(--gold-bg);border:1px solid #ecd39a;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.suggest b{font:700 22px var(--serif);color:var(--deep)}
details.ce{border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:10px}
details.ce summary{min-height:46px;display:flex;align-items:center;padding:0 12px;font-weight:600;cursor:pointer}
details.ce .in{padding:0 12px 12px}
.ce .g6{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ce .g6 label{font-size:11px;color:var(--muted);font-weight:600}
.ce .g6 input{width:100%;min-height:42px;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.sbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hint{font-size:12px;color:var(--muted)}
.mode{display:inline-block;margin-top:3px;font:700 11px var(--sans);padding:3px 8px;border-radius:999px;letter-spacing:.2px}
.mode.bot{background:#e8eef9;color:#1f4b8f}.mode.you{background:var(--gold-bg);color:#7a5a12}
.checklist{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.checklist ol{margin:0;padding-left:20px}.checklist li{margin:4px 0}
details.ed{margin-top:10px;border-top:1px solid var(--line)}details.ed>summary{min-height:44px;display:flex;align-items:center;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.sites label{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}.sites input{width:22px;height:22px}
.foot{text-align:center;font-size:13px;color:var(--muted);margin:10px 0 24px}.foot a{color:var(--muted)}
.top{position:relative}
.acct-slot{position:absolute;right:0;top:calc(10px + env(safe-area-inset-top))}
.acct{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--paper);border:1px solid var(--line);text-decoration:none;color:var(--ink);font:600 13px var(--sans)}
.acct img,.acct .ini{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--deep);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.acct .nm{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#bbb;display:inline-block}.dot.ok{background:var(--sage)}.dot.pend{background:var(--mustard)}.dot.err{background:var(--red)}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:0 0 44px;background:var(--deep);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.gbtn{background:#fff;border-color:#dadce0;color:#3c4043}.gbtn[disabled]{opacity:.6}
.gs{font-size:13px;color:var(--muted);margin-top:4px}.gs.err{color:var(--red);font-weight:600;background:var(--red-bg);border-radius:10px;padding:8px 10px}.gs.pend{color:#7a5a12}
code{background:#f3e9da;padding:1px 4px;border-radius:4px;font-size:12px;word-break:break-all}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav" id="nav">
  <a href="#/" data-nav="inv"><span class="i">&#129530;</span>Inventory</a>
  <a href="#/add" class="add" data-nav="add" aria-label="Add item"><span class="plus">+</span></a>
  <a href="#/backup" data-nav="backup"><span class="i">&#9881;&#65039;</span>Settings</a>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ===================== CONFIG (edit freely) ===================== */
const APP_NAME = 'Hanger Hustle';           // <- change the app name here
const APP_TAGLINE = 'vintage inventory \u00b7 cross-listing helper';
const SKU_PREFIX = 'V-';
const IMG_MAX_PX = 1600, IMG_QUALITY = 0.8, THUMB_PX = 360;
const DB_NAME = 'closet-to-cash-db';   // kept from the app's first name so existing data keeps working (as are 'ctc-' storage keys and the Drive file name)

/* Google backup. OAuth *Web* client ID from Cloud project "closet-to-cash" (public ID, not a secret).
   Empty = Google backup button shows disabled "coming soon". Google's script only loads when she taps Sign in. */
const GOOGLE_CLIENT_ID = '196912346158-dasm934sl5l3ggd6fgr409fei0bkho82.apps.googleusercontent.com';
const GOOGLE_SCOPES = 'openid email profile https://www.googleapis.com/auth/drive.appdata';
const AUTO_BACKUP_DELAY_MS = 10000;   // auto backup this long after the last edit (and when the app is hidden)

const TYPES = ['dress','top','blouse','jacket','coat','jeans','pants','skirt','sweater','t-shirt','shoes','bag','accessory','other'];
const TYPE_LABEL = {'t-shirt':'T-Shirt'};
const ERAS = ['40s','50s','60s','70s','80s','90s','Y2K','2010s','Unknown'];
const CONDITIONS = [['nwt','New with tags'],['excellent','Excellent'],['verygood','Very good'],['good','Good'],['fair','Fair']];

/* Posting modes (Michael's decision 2026-10-21): bots only where the site allows it.
   NOTE: the bot itself is not built yet. "Queue for bot" just marks the item; she can always post it herself. */
const POST_MODES = {
  api:      {label:'Bot posts (official API)',          short:'Bot \u00b7 API'},
  crosslist:{label:'Bot posts (allowed crosslisting)',  short:'Bot \u00b7 crosslist'},
  prefill:  {label:'She publishes (pre-filled)',        short:'You publish'},
};
/* Character limits: approximations; marketplaces change these. null = no meaningful limit.
   on = shown by default (she can toggle sites in Settings). */
const PLATFORMS = {
  poshmark:{name:'Poshmark', short:'PM', color:'#7f0353', create:'https://poshmark.com/create-listing', titleMax:80, descMax:1500, mode:'prefill', on:true},
  ebay:    {name:'eBay',     short:'eB', color:'#0064d2', create:'https://www.ebay.com/sl/sell',      titleMax:80, descMax:null, mode:'api', on:true,
            modeNote:'Bot will post through eBay\u2019s official Sell (Inventory) API once Michael sets up the eBay developer app.'},
  depop:   {name:'Depop',    short:'Dp', color:'#ff2300', create:'https://www.depop.com/products/create/', titleMax:null, descMax:1000, mode:'crosslist', on:true,
            modeNote:'Depop\u2019s Terms allow crosslisting tools if you remove the item promptly when it sells elsewhere. The bot will use Depop\u2019s official Selling API (access by request: business@depop.com); a bot clicking through the Depop website itself is not allowed.'},
  vinted:  {name:'Vinted',   short:'Vt', color:'#007782', create:'https://www.vinted.com/items/new',  titleMax:100, descMax:2000, mode:'prefill', on:true},
  mercari: {name:'Mercari',  short:'Mc', color:'#5356ee', create:'https://www.mercari.com/sell/',     titleMax:80, descMax:1000, mode:'prefill', on:true},
  etsy:    {name:'Etsy',     short:'Et', color:'#f1641e', create:'https://www.etsy.com/your/shops/me/listing-editor/create', titleMax:140, descMax:null, tagsMax:13, tagLen:20, mode:'api', on:true,
            modeNote:'Bot will post through Etsy\u2019s official Open API v3 once Michael registers an Etsy app for her shop. Etsy \u201cvintage\u201d = at least 20 years old.'},
  facebook:{name:'FB Marketplace', short:'FB', color:'#1877f2', create:'https://www.facebook.com/marketplace/create/item', titleMax:100, descMax:null, mode:'prefill', on:false,
            modeNote:'No listing API for individuals and Meta bans automated access, so you publish it. Great for local pickup (no fee).'},
  grailed: {name:'Grailed',  short:'Gr', color:'#111111', create:'https://www.grailed.com/sell', titleMax:null, descMax:null, mode:'prefill', on:false,
            modeNote:'Mostly menswear/streetwear. Grailed bans third-party tools without written consent, so you publish it.'},
};

function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('Could not read image (unsupported format?)')); i.src=src; }); }
async function resizeImage(blob,max,q){
  const url=URL.createObjectURL(blob);
  try{
    const img=await loadImg(url);   // modern browsers apply EXIF orientation when drawing
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.max(1,Math.round(img.naturalWidth*s)), h=Math.max(1,Math.round(img.naturalHeight*s));
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
    let out=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
    if(!out) out=new Blob([dataURLToBuf(c.toDataURL('image/jpeg',q)).buf],{type:'image/jpeg'});
    c.width=c.height=0;
    return out;
  } finally { URL.revokeObjectURL(url); }
}
const blobToDataURL = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(b); });
const blobToBuf = b => b.arrayBuffer ? b.arrayBuffer() : new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsArrayBuffer(b); });
function dataURLToBuf(d){ const i=d.indexOf(','), h=d.slice(0,i), bin=atob(d.slice(i+1)); const u=new Uint8Array(bin.length); for(let j=0;j<bin.length;j++) u[j]=bin.charCodeAt(j); return {buf:u.buffer,type:(h.match(/data:([^;,]+)/)||[,'image/jpeg'])[1]}; }
async function makeThumb(blob){ return blobToDataURL(await resizeImage(blob,THUMB_PX,0.72)); }

/* ===================== listing generator (pure templates, no AI) ===================== */
function eraWord(it){ if(!it.era||it.era==='Unknown') return 'Vintage'; if(it.era==='Y2K') return 'Y2K'; if(it.era==='2010s') return '2010s'; return 'Vintage '+it.era; }
function buildTitle(it,max){
  const kws=kwList(it).slice(0,3);
  // [text, priority] - highest priority number is dropped first when over the limit
  const parts=[
    [it.condition==='nwt'?'NWT':'',6],
    [eraWord(it),1],[it.brand||'',1],
    ...kws.map((k,i)=>[titleCase(k),7+i]),
    [titleCase(it.color||''),4],[titleCase(it.material||''),5],
    [it.type==='other'?'':typeLabel(it.type),0],
    [it.size?'Size '+it.size:'',2],
  ].filter(p=>p[0]);
  const join = ps => ps.map(p=>p[0]).join(' ').replace(/\s+/g,' ').trim();
  let ps=parts.slice();
  if(max){ while(join(ps).length>max && ps.length>1){ let wi=0; ps.forEach((p,i)=>{ if(p[1]>=ps[wi][1]) wi=i; }); ps.splice(wi,1); } }
  let t=join(ps);
  if(max && t.length>max) t=t.slice(0,max).trim();
  return t;
}
const isNum = v => /^\d+(\.\d+)?$/.test(String(v).trim());
function measLines(it,bullet='\u2022 '){
  const m=[]; const f=(v,l)=>{ if(v!=null&&v!=='') m.push(`${bullet}${l}: ${v}${isNum(v)?'"':''}`); };
  f(it.pit,'Pit to pit'); f(it.length,'Length'); f(it.waist,'Waist'); f(it.inseam,'Inseam'); return m;
}
function condSentence(it){
  const c=condLabel(it.condition);
  let s = it.condition==='nwt' ? 'New with tags.' : c ? `${c} vintage condition.` : '';
  if(it.flaws) s += ` Flaws: ${it.flaws.trim().replace(/\.?$/,'.')}`;
  else if(it.condition && it.condition!=='nwt') s += ' No major flaws noted.';
  return s.trim();
}
function clip(s,max){ if(!max||s.length<=max) return s; return s.slice(0,max-1).trimEnd()+'\u2026'; }
const tagify = s => '#'+String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
function generate(p,it){
  const P=PLATFORMS[p], ty=typeLabel(it.type)||'piece', kws=kwList(it), meas=measLines(it);
  const lead = `${eraWord(it)} ${it.brand?it.brand+' ':''}${ty.toLowerCase()}`;
  const sizeLine = it.size ? `Size on tag: ${it.size} (vintage sizing runs small \u2014 please go by measurements).` : 'No size tag \u2014 please go by measurements.';
  const basics = [it.brand&&`Brand: ${it.brand}`, it.era&&it.era!=='Unknown'&&`Era: ${it.era}`, it.color&&`Color: ${it.color}`, it.material&&`Material: ${it.material}`].filter(Boolean);
  let title, desc;
  if(p==='poshmark'){
    title=buildTitle(it,P.titleMax);
    desc=[`${lead}${kws.length?' \u2014 '+kws.slice(0,4).join(', '):''}.`, '', ...basics, sizeLine,
      ...(meas.length?['','Measurements (laid flat):',...meas]:[]),
      '', `Condition: ${condSentence(it)}`, '', 'Bundle & save! Ships fast.', `SKU ${it.sku||''}`].join('\n');
  } else if(p==='ebay'){
    title=buildTitle(it,P.titleMax);
    const spec=[['Brand',it.brand||'Unbranded'],['Type',ty],['Size',it.size||'See measurements'],['Color',it.color],['Material',it.material],
      ['Decade',it.era&&it.era!=='Unknown'?it.era:''],['Style',kws.join(', ')],
      ['Condition',it.condition==='nwt'?'New with tags':'Pre-owned \u2014 '+(condLabel(it.condition)||'see description')],
      ['Pit to pit',it.pit],['Length',it.length],['Waist',it.waist],['Inseam',it.inseam],['SKU',it.sku]].filter(x=>x[1]!=null&&x[1]!=='');
    desc=[`${lead}${it.color?' in '+it.color.toLowerCase():''}.`, '', condSentence(it), '', sizeLine,
      ...(meas.length?['','Measurements (taken flat):',...meas]:[]),
      '', '\u2014 ITEM SPECIFICS \u2014', ...spec.map(([k,v])=>`${k}: ${v}${['Pit to pit','Length','Waist','Inseam'].includes(k)&&isNum(v)?'"':''}`),
      '', 'Please review all photos \u2014 they are part of the description. Ships within 1 business day.'].join('\n');
  } else if(p==='depop'){
    // Depop has no separate title field: the first line of the description acts as the headline.
    const tags=[...new Set(['vintage', it.era&&it.era!=='Unknown'?it.era:'', it.brand, it.type, ...kws].filter(Boolean).map(tagify).filter(t=>t.length>2))].slice(0,5);
    title=`${it.era&&it.era!=='Unknown'?it.era+' ':'vintage '}${it.brand?it.brand+' ':''}${it.color?it.color+' ':''}${ty}`.toLowerCase().replace(/\s+/g,' ').trim();
    desc=[`${title} \u2728`, kws.length?kws.join(' \u00b7 ').toLowerCase():'', '',
      it.size?`size on tag: ${it.size} \u2014 check measurements`:'no size tag \u2014 check measurements',
      ...measLines(it,'\u21b3 ').map(s=>s.toLowerCase()), it.material?`\u21b3 ${it.material.toLowerCase()}`:'',
      '', `condition: ${condSentence(it).toLowerCase()}`, '', 'bundle for a discount \u2022 ships in 1\u20132 days', '', tags.join(' ')].join('\n');
  } else if(p==='vinted'){
    title=buildTitle(it,P.titleMax);
    desc=[`${lead}.`, ...basics, sizeLine, ...measLines(it,'- '), `Condition: ${condSentence(it)}`, kws.length?`Style: ${kws.join(', ')}`:''].filter(Boolean).join('\n');
  } else if(p==='etsy'){
    title=buildTitle(it,P.titleMax);
    desc=[`${lead}${it.color?' in '+it.color.toLowerCase():''}${kws.length?' \u2014 '+kws.slice(0,5).join(', '):''}.`, '',
      ...basics, sizeLine, ...(meas.length?['','Measurements (laid flat):',...meas]:[]),
      '', `Condition: ${condSentence(it)}`, 'As a true vintage piece it may show gentle signs of age; please see all photos.',
      '', 'Ships within 1\u20132 business days, carefully packed.', `SKU ${it.sku||''}`].join('\n');
  } else if(p==='facebook'){
    title=buildTitle(it,P.titleMax);
    desc=[`${lead}.`, ...basics, sizeLine, ...measLines(it,'- '), `Condition: ${condSentence(it)}`, '', 'Local pickup or shipping available.'].filter(x=>x!=null).join('\n');
  } else if(p==='grailed'){
    title=buildTitle(it,60);
    desc=[`${lead}.`, ...basics, sizeLine, ...measLines(it,'- '), `Condition: ${condSentence(it)}`, kws.length?`Style: ${kws.join(', ')}`:''].filter(Boolean).join('\n');
  } else {
    title=buildTitle(it,P.titleMax);
    desc=[`${lead}${kws.length?' \u2014 '+kws.slice(0,4).join(', '):''}.`, '', ...basics, sizeLine, ...measLines(it,'- '),
      '', `Condition: ${condSentence(it)}`, '', 'Ships fast. Offers welcome!', `SKU ${it.sku||''}`].join('\n');
  }
  desc=desc.replace(/\n{3,}/g,'\n\n').trim();
  const out={title, desc:clip(desc,P.descMax)};
  if(P.tagsMax) out.tags=etsyTags(it).join(', ');
  return out;
}
/* Etsy tags: up to 13, each max 20 characters, letters/numbers/spaces only */
function etsyTags(it){
  const era=it.era&&it.era!=='Unknown'?it.era:'';
  const ty=(it.type||'').replace('t-shirt','tee'), cand=['vintage '+ty, era&&(era==='Y2K'?'y2k':era+' vintage'), era&&(era+' '+ty), it.brand&&('vintage '+it.brand), it.brand,
    ...kwList(it), it.color&&(it.color+' '+ty), it.material&&(it.material+' '+ty), it.size&&('size '+it.size), 'vintage clothing', 'retro '+ty, 'vintage fashion', 'thrifted '+ty, era&&(era+' fashion')];
  const out=[];
  for(let t of cand){ if(!t) continue; t=String(t).toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim(); if(!t) continue;
    if(t.length>20) t=t.slice(0,20).replace(/\s+\S*$/,'').trim()||t.slice(0,20); if(t&&!out.includes(t)) out.push(t); if(out.length===13) break; }
  return out;
}
function etsyVintageWarning(it){
  if(it.era==='2010s') return 'Etsy only allows items at least 20 years old as vintage (made 2006 or earlier). A 2010s piece can\u2019t be listed as vintage on Etsy.';
  if(!it.era||it.era==='Unknown') return 'Etsy vintage must be at least 20 years old (made 2006 or earlier) \u2014 double-check before listing.';

}
const listingFor = (p,it) => { const g=generate(p,it), c=(it.custom&&it.custom[p])||{}; return {title:c.title??g.title, desc:c.desc??g.desc, tags:c.tags??g.tags}; };
const fullListing = (L) => `${L.title}\n\n${L.desc}${L.tags?`\n\nTags: ${L.tags}`:''}`;

/* ===================== value comparison ===================== */
function feeFor(p,price,c={}){
  if(!price) return 0;
  const d=FEE_DEFAULTS[p];
  if(c.feePct==null && c.feeFixed==null){
    if(p==='poshmark') return price<15 ? 2.95 : price*0.20;
    if(p==='grailed') return Math.max(1.99, price*(price<120?0.06:0.09)) + price*0.0349 + 0.49;
    if(p==='facebook') return Math.max(0.80, price*0.10);   // shipped sale; local pickup is free
  }
  const pct=c.feePct!=null?c.feePct:(d.pct||0), fx=c.feeFixed!=null?c.feeFixed:(d.fixed||0);
  return Math.max(0, price*pct/100 + fx);
}
const netAt = (p,price,c) => price ? Math.round((price - feeFor(p,price,c))*100)/100 : null;
function compAnalysis(it){
  const comps=it.comps||{}, ask=it.price||null;
  const rows=shownKeys(it).map(p=>{
    const c=comps[p]||{}, med=c.median!=null?c.median:null;
    return {p,c,netAsk:netAt(p,ask,c),netMed:med!=null?netAt(p,med,c):null};
  });
  const withComps=rows.filter(r=>r.netMed!=null);
  // Best = highest expected net at that platform's median sold price (if any comps), else highest net at asking price.
  const basis = withComps.length ? 'median' : (ask ? 'ask' : null);
  let best=null;
  if(basis==='median') best=withComps.reduce((a,b)=>b.netMed>a.netMed?b:a).p;
  else if(basis==='ask') best=rows.reduce((a,b)=>b.netAsk>a.netAsk?b:a).p;
  // Suggested list price = comp-count-weighted average of platform medians, rounded to a whole dollar.
  let suggested=null, w=0, s=0;
  withComps.forEach(r=>{ const n=Math.max(1,r.c.count||1); s+=r.c.median*n; w+=n; });
  if(w) suggested=Math.round(s/w);
  return {rows,best,basis,suggested};
}
function normalizeComps(obj){
  // Accepts {ebay:{...},...} or {comps:{...}}. Keys: low, median, high, count, feePct, feeFixed.
  if(obj && obj.comps) obj=obj.comps;
  if(!obj || typeof obj!=='object' || Array.isArray(obj)) throw new Error('Expected a JSON object');
  const out={};
  for(const k of Object.keys(obj)){
    const p=k.toLowerCase(); if(!PLATFORMS[p]) continue;
    const v=obj[k]||{}, o={};
    for(const f of ['low','median','high','count','feePct','feeFixed']){ const n=num(v[f]); if(n!=null) o[f]=n; }
    out[p]=o;
  }
  if(!Object.keys(out).length) throw new Error('No platform keys found (use ebay, poshmark, mercari, depop, vinted)');
  return out;
}
function compQuery(it){ return (it.compQuery && it.compQuery.trim()) || [it.brand, it.era&&it.era!=='Unknown'?(it.era==='Y2K'?'y2k':'vintage '+it.era):'vintage', it.color, it.type==='other'?'':it.type].filter(Boolean).join(' '); }

/* ===================== clipboard / download ===================== */
async function copyText(text){
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); return true; } }catch(e){ /* fall back below */ }
  const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';
  document.body.appendChild(ta); ta.focus(); ta.select(); try{ ta.setSelectionRange(0,text.length); }catch(e){}
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  ta.remove(); return ok;
}
function downloadBlob(blob,name){
  const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=name; a.rel='noopener';
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); },8000);
}

function renderList(){
  const s={total:ITEMS.length,listed:0,sold:0,rev:0,cost:0};
  ITEMS.forEach(it=>{ const x=st(it); if(x.sold){ s.sold++; s.rev+=soldPrice(it); s.cost+=(it.cost||0);} else if(x.listed) s.listed++; });
  // Profit = revenue of sold items minus what you paid for those sold items.
  $('#stats').innerHTML=`
    <div class="stat"><b>${s.total}</b><span>Items</span></div>
    <div class="stat"><b>${s.listed}</b><span>Listed</span></div>
    <div class="stat"><b>${s.sold}</b><span>Sold</span></div>
    <div class="stat"><b>${money(s.rev)}</b><span>Revenue</span></div>
    <div class="stat"><b style="color:${s.rev-s.cost<0?'var(--red)':'var(--sage)'}">${money(s.rev-s.cost)}</b><span>Profit</span></div>
    <div class="stat"><b>${ITEMS.length-s.sold}</b><span>In stock</span></div>`;
  const nd=ITEMS.filter(it=>st(it).needsDelist);
  $('#globalAlert').innerHTML = nd.length ? `<button class="alert" id="ndBtn"><span class="x">\u26a0</span><span>${nd.length} sold item${nd.length>1?'s are':' is'} still listed elsewhere<small>Tap to see what to remove</small></span></button>` : '';
  if(nd.length) $('#ndBtn').onclick=()=>{ UI.filter='delist'; renderInventory(); };
  const q=UI.q.trim().toLowerCase();
  const list=ITEMS.filter(it=>{
    const x=st(it);
    if(UI.filter==='unlisted'&&!x.unlisted) return false;
    if(UI.filter==='listed'&&!(x.listed&&!x.sold)) return false;
    if(UI.filter==='sold'&&!x.sold) return false;
    if(UI.filter==='delist'&&!x.needsDelist) return false;
    if(q){ const hay=[it.sku,it.brand,it.type,it.era,it.color,it.material,it.keywords,it.size,buildTitle(it)].join(' ').toLowerCase(); if(!q.split(/\s+/).every(w=>hay.includes(w))) return false; }
    return true;
  });
  const by={new:(a,b)=>b.createdAt-a.createdAt, old:(a,b)=>a.createdAt-b.createdAt, phigh:(a,b)=>(b.price||0)-(a.price||0), plow:(a,b)=>(a.price||0)-(b.price||0)};
  list.sort(by[UI.sort]);
  const el=$('#list');
  if(!ITEMS.length){ el.className='items'; el.innerHTML=`<div class="empty"><h2>Your rack is empty</h2><p>Tap the <b>+</b> button to photograph your first piece.</p><a class="btn primary" href="#/add">+ Add first item</a></div>`; return; }
  el.className='items '+UI.view;
  if(!list.length){ el.innerHTML=`<div class="empty" style="grid-column:1/-1">No items match.</div>`; return; }
  el.innerHTML=list.map(it=>{
    const x=st(it), dl=delistTargets(it);
    return `<a class="card" href="#/item/${it.id}">
      ${x.needsDelist?`<span class="ribbon">DELIST \u00d7${dl.length}</span>`:x.sold?`<span class="ribbon sold">SOLD</span>`:''}
      <div class="thumb">${it.thumb?`<img src="${it.thumb}" alt="" loading="lazy">`:'<span>no photo</span>'}</div>
      <div class="ci"><div class="sku">${esc(it.sku)}</div><div class="t">${esc(buildTitle(it,80)||'Untitled')}</div>
      <div class="price">${money(x.sold?soldPrice(it):it.price)}</div>
      <div class="pchips">${shownKeys(it).map(k=>{ const s=it.status?.[k]?.state||'none'; const cls= s==='listed'&&x.sold?'delist':s; return `<span class="pc ${cls}" title="${PLATFORMS[k].name}: ${s}">${PLATFORMS[k].short}${s==='sold'?' \u2713':''}</span>`; }).join('')}</div></div></a>`;
  }).join('');
}

async function postFlow(p){
  const P=PLATFORMS[p], txt=fullListing(cardListing(p));
  const copied=copySync(txt);                 // synchronous copy while the page still has focus
  const files=DETAIL.files, canShare=files.length&&navigator.canShare&&navigator.share&&navigator.canShare({files});
  if(!canShare) window.open(P.create,'_blank','noopener');   // must run inside the tap

  showChecklist(p,ok,canShare);
  if(canShare){ try{ await navigator.share({files, title:cardListing(p).title}); }catch(e){ if(e.name!=='AbortError') downloadPhotos(); } }
  else if(files.length) downloadPhotos();

function copySync(text){
  const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';
  document.body.appendChild(ta); ta.focus(); ta.select(); try{ ta.setSelectionRange(0,text.length); }catch(e){}
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); return ok;
}
function bindPcard(p){

  const counts=()=>{

    ct.textContent=ti.value.length+(P.titleMax?` / ${P.titleMax}`:' chars'); ct.classList.toggle('over',!!P.titleMax&&ti.value.length>P.titleMax);
    cd.textContent=de.value.length+(P.descMax?` / ${P.descMax}`:' chars')+(p==='depop'?` \u00b7 ${tags}/5 #`:'');
    cd.classList.toggle('over',(!!P.descMax&&de.value.length>P.descMax)||(p==='depop'&&tags>5));
    if(tg){ const list=tg.value.split(',').map(x=>x.trim()).filter(Boolean), long=list.filter(x=>x.length>P.tagLen).length, cg=$('[data-c=g]',el);
      cg.textContent=`${list.length} / ${P.tagsMax} tags${long?` \u00b7 ${long} over ${P.tagLen} chars`:''}`; cg.classList.toggle('over',list.length>P.tagsMax||long>0); }

/* ===================== Google sign-in + Drive backup (client-side only) =====================
   - Google Identity Services *token client* gives a short-lived access token (about 1 hour). No backend.
   - Scope drive.appdata = a hidden per-app folder in HER OWN Drive. This app can't see her other files,
     and the folder doesn't show in the Drive UI (Drive > Settings > Manage apps shows it).
   - Layout in appDataFolder:
       closet-to-cash-inventory.json  -> {format,version,updatedAt,contentHash,skuCounter,items[],photos[],tombstones{}}
                                          (items without thumbnails; photos[] = {id,itemId,idx,hash,type})
       photo-<photoId>.jpg            -> one file per photo, appProperties {kind:'photo',photoId,itemId,hash}
   - Backup = list folder, read cloud inventory, merge (newest updatedAt wins per item, cloud-only items kept,
     deleted items dropped via tombstones), upload only photos whose id/hash isn't in the cloud yet,
     delete cloud photos no longer referenced, write inventory. Backup never changes local data.
   - Restore = explicit, confirmed, additive: adds cloud-only items, replaces local items only where the
     cloud copy is newer (after confirm), never deletes local-only items. */
const AUTH_KEY='ctc-google-auth';
const DRIVE_API='https://www.googleapis.com/drive/v3', DRIVE_UPLOAD='https://www.googleapis.com/upload/drive/v3';
const DRIVE_INV_NAME='closet-to-cash-inventory.json';
class AuthNeeded extends Error{ constructor(m){ super(m||'Google sign-in needed'); this.name='AuthNeeded'; } }

const Auth = {
  token:null, exp:0, profile:null, silentTried:false,
  enabled(){ return !!GOOGLE_CLIENT_ID; },
  load(){ try{ const s=JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); if(s){ this.token=s.token; this.exp=s.exp||0; this.profile=s.profile||null; } }catch(e){} },
  save(){ try{ localStorage.setItem(AUTH_KEY,JSON.stringify({token:this.token,exp:this.exp,profile:this.profile})); }catch(e){} },
  signedIn(){ return this.enabled() && !!this.profile; },
  valid(){ return !!this.token && Date.now() < this.exp-60000; },
  setToken(t,expiresIn){ this.token=t; this.exp=Date.now()+(+expiresIn||3600)*1000; this.silentTried=false; this.save(); },
  loadGis(){
    if(window.google&&google.accounts&&google.accounts.oauth2) return Promise.resolve();
    if(this._gisP) return this._gisP;
    return this._gisP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.async=true;
      s.onload=()=>res(); s.onerror=()=>{ this._gisP=null; rej(new Error('Could not load Google sign-in (are you offline?)')); }; document.head.appendChild(s); });
  },
  // prompt '' = no UI if she already consented; 'consent'/'select_account' = show Google's dialog
  async request(prompt=''){
    await this.loadGis();
    return new Promise((res,rej)=>{
      let done=false; const fin=(f,v)=>{ if(!done){ done=true; f(v); } };
      const client=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID, scope:GOOGLE_SCOPES, hint:this.profile&&this.profile.email||undefined,
        callback:r=>{ if(r.error) return fin(rej,new AuthNeeded(r.error_description||r.error));
          if(google.accounts.oauth2.hasGrantedAllScopes && !google.accounts.oauth2.hasGrantedAllScopes(r,'https://www.googleapis.com/auth/drive.appdata')) return fin(rej,new AuthNeeded('Please allow access to the app folder in Google Drive so backups can work.'));
          this.setToken(r.access_token,r.expires_in); fin(res,r.access_token); },
        error_callback:e=>fin(rej,new AuthNeeded(e&&e.type==='popup_closed'?'Sign-in window closed':'Google sign-in could not open ('+((e&&(e.message||e.type))||'blocked')+')'))});
      client.requestAccessToken({prompt});
      setTimeout(()=>fin(rej,new AuthNeeded('Google sign-in timed out')),120000);
    });
  },
  // interactive=true only from a tap (popups need a user gesture)
  async getToken(interactive=false){
    if(this.valid()) return this.token;
    if(!this.enabled()) throw new AuthNeeded('Google backup is not configured');
    if(interactive) return this.request('');
    if(!this.silentTried && document.visibilityState==='visible'){ this.silentTried=true; try{ return await this.request(''); }catch(e){} }
    throw new AuthNeeded('Google sign-in expired \u2014 tap \u201cBack up now\u201d to reconnect');
  },
  async signIn(){
    await this.request('');
    const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+this.token}});
    if(!r.ok) throw new Error('Could not read your Google profile ('+r.status+')');
    const u=await r.json(); this.profile={name:u.name||u.email,email:u.email,picture:u.picture||''}; this.save();
  },
  signOut(){
    try{ if(this.token&&window.google&&google.accounts&&google.accounts.oauth2) google.accounts.oauth2.revoke(this.token,()=>{}); }catch(e){}
    this.token=null; this.exp=0; this.profile=null; try{ localStorage.removeItem(AUTH_KEY); }catch(e){}
  }
};

/* ---- Drive REST v3 helpers ---- */
async function gfetch(url,opts={},retry=true){
  const tok=await Auth.getToken(!!opts.interactive);
  const r=await fetch(url,{method:opts.method||'GET',body:opts.body,headers:{...(opts.headers||{}),Authorization:'Bearer '+tok}});
  if(r.status===401&&retry){ Auth.token=null; Auth.exp=0; Auth.silentTried=false; Auth.save(); return gfetch(url,opts,false); }
  if(!r.ok){ let msg=r.status+' '+(r.statusText||''); try{ const j=await r.json(); msg=(j.error&&j.error.message)||msg; }catch(e){}
    const err=new Error('Google Drive: '+msg); err.status=r.status; if(r.status===401) throw new AuthNeeded('Google sign-in expired \u2014 tap \u201cBack up now\u201d to reconnect'); throw err; }
  return r;
}
async function driveListAll(o){
  const out=[]; let pt='';
  do{ const r=await gfetch(`${DRIVE_API}/files?spaces=appDataFolder&pageSize=1000&fields=${encodeURIComponent('nextPageToken,files(id,name,appProperties,modifiedTime,size)')}${pt?'&pageToken='+encodeURIComponent(pt):''}`,o);
      const j=await r.json(); out.push(...(j.files||[])); pt=j.nextPageToken||''; }while(pt);
  return out;
}
function multipartBody(meta,data,mime){
  const b='ctc'+Math.random().toString(36).slice(2)+Date.now().toString(36);
  return {type:`multipart/related; boundary=${b}`, body:new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${mime}\r\n\r\n`, data, `\r\n--${b}--`])};
}
async function driveUpload({id,name,mime,data,appProperties},o={}){
  const meta=id?{name,appProperties}:{name,parents:['appDataFolder'],appProperties};
  const {body,type}=multipartBody(meta,data,mime);
  const r=await gfetch(`${DRIVE_UPLOAD}/files${id?'/'+encodeURIComponent(id):''}?uploadType=multipart&fields=id,name,appProperties`,{...o,method:id?'PATCH':'POST',headers:{'Content-Type':type},body});
  return r.json();
}
const driveDownload=(id,o)=>gfetch(`${DRIVE_API}/files/${encodeURIComponent(id)}?alt=media`,o);
const driveDelete=(id,o)=>gfetch(`${DRIVE_API}/files/${encodeURIComponent(id)}`,{...o,method:'DELETE'}).catch(e=>{ if(e.status!==404) throw e; });

async function hashBuf(buf){
  try{ if(window.crypto&&crypto.subtle){ const h=await crypto.subtle.digest('SHA-256',buf); return Array.from(new Uint8Array(h).slice(0,16),b=>b.toString(16).padStart(2,'0')).join(''); } }catch(e){}
  const u=new Uint8Array(buf); let h=0x811c9dc5; for(let i=0;i<u.length;i++){ h^=u[i]; h=Math.imul(h,16777619)>>>0; } return 'fnv'+h.toString(16)+'-'+u.length;
}
function hashStr(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h.toString(16)+'-'+s.length; }

/* ---- pure planning functions (unit-tested) ---- */
const stripItem = it => { const c={...it}; delete c.thumb; return c; };
function planBackup(local,remote,remotePhotoFiles){
  // local: {items,photos,tomb,sku}; remote: cloud inventory or null; remotePhotoFiles: Map photoId -> Drive file
  const tomb={...((remote&&remote.tombstones)||{})};
  for(const [k,v] of Object.entries(local.tomb||{})) tomb[k]=Math.max(tomb[k]||0,v);
  const win=new Map();   // id -> {item, src:'local'|'remote'}
  for(const it of (remote&&remote.items)||[]) win.set(it.id,{item:it,src:'remote'});
  for(const it of local.items){ const r=win.get(it.id); if(!r||(it.updatedAt||0)>=(r.item.updatedAt||0)) win.set(it.id,{item:it,src:'local'}); }
  for(const [id,t] of Object.entries(tomb)){ const w=win.get(id); if(w&&(w.item.updatedAt||0)<=t) win.delete(id); }
  const photos=[], upload=[];
  for(const [id,w] of win){
    if(w.src==='local') for(const p of local.photos.filter(p=>p.itemId===id)){
      photos.push({id:p.id,itemId:id,idx:p.idx,hash:p.hash,type:p.type||'image/jpeg'});
      const f=remotePhotoFiles.get(p.id); if(!f||!f.appProperties||f.appProperties.hash!==p.hash) upload.push(p);
    } else for(const p of ((remote&&remote.photos)||[]).filter(p=>p.itemId===id)) photos.push(p);
  }
  const keep=new Set(photos.map(p=>p.id));
  const deleteFiles=[...remotePhotoFiles.entries()].filter(([pid])=>!keep.has(pid)).map(([,f])=>f);
  const items=[...win.values()].map(w=>stripItem(w.item)).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  photos.sort((a,b)=>a.id<b.id?-1:1);
  const skuCounter=Math.max(local.sku||0,(remote&&remote.skuCounter)||0);
  const contentHash=hashStr(JSON.stringify({items,photos,tomb,skuCounter}));
  const unchanged=!!remote&&remote.contentHash===contentHash&&!upload.length&&!deleteFiles.length;
  return {inventory:{format:'closet-to-cash-drive',version:1,app:APP_NAME,updatedAt:Date.now(),contentHash,skuCounter,items,photos,tombstones:tomb},upload,deleteFiles,unchanged,
    cloudOnly:items.filter(i=>!local.items.some(l=>l.id===i.id)).length};
}
function planRestore(localItems,remote){
  const res={add:[],update:[],keepLocal:[],same:0};
  const byId=new Map(localItems.map(i=>[i.id,i])), bySku=new Map(localItems.filter(i=>i.sku).map(i=>[i.sku,i]));
  for(const r of (remote&&remote.items)||[]){
    const l=byId.get(r.id)||(r.sku&&bySku.get(r.sku));
    if(!l) res.add.push(r);
    else if((r.updatedAt||0)>(l.updatedAt||0)) res.update.push({remote:r,local:l});
    else if((r.updatedAt||0)<(l.updatedAt||0)) res.keepLocal.push(l);
    else res.same++;
  }
  return res;
}

/* ---- sync state, auto backup ---- */
const SYNC={dirty:false,running:false,again:false,timer:null,state:'idle',msg:'',last:null};
function setSync(state,msg){ SYNC.state=state; SYNC.msg=msg||''; updateSyncUI(); }
function autoBackupOn(){ return Auth.signedIn() && localStorage.getItem('ctc-auto-backup')!=='off'; }
function markDirty(){
  if(SYNC.suspend) return;
  SYNC.dirty=true;
  if(!autoBackupOn()) return;
  clearTimeout(SYNC.timer); setSync('pending','Changes waiting to back up\u2026');
  SYNC.timer=setTimeout(()=>backupNow({reason:'auto'}),AUTO_BACKUP_DELAY_MS);
}
function flushOnHide(){ if(document.visibilityState==='hidden'&&SYNC.dirty&&autoBackupOn()){ clearTimeout(SYNC.timer); backupNow({reason:'hide'}); } }

async function backupNow({reason='manual'}={}){
  if(!Auth.signedIn()) return;
  if(SYNC.running){ SYNC.again=true; return; }
  SYNC.running=true; clearTimeout(SYNC.timer); SYNC.dirty=false;
  const o={interactive:reason==='manual'};
  setSync('running','Backing up to Google Drive\u2026');
  try{
    const files=await driveListAll(o);
    const invFile=files.find(f=>f.name===DRIVE_INV_NAME);
    const rp=new Map(); files.filter(f=>f.appProperties&&f.appProperties.kind==='photo').forEach(f=>rp.set(f.appProperties.photoId,f));
    const remote=invFile?await (await driveDownload(invFile.id,o)).json():null;
    const local={items:await getAllItems(),photos:await getAllPhotos(),tomb:(await getMeta('tombstones'))||{},sku:(await getMeta('sku'))||0};
    for(const p of local.photos) if(!p.hash){ p.hash=await hashBuf(p.buf); await reqP(os('photos','readwrite').put(p)); }
    const plan=planBackup(local,remote,rp);
    let up=0;
    for(const p of plan.upload){ setSync('running',`Uploading photo ${++up} of ${plan.upload.length}\u2026`); const f=rp.get(p.id);
      await driveUpload({id:f&&f.id,name:`photo-${p.id}.jpg`,mime:p.type||'image/jpeg',data:new Blob([p.buf],{type:p.type||'image/jpeg'}),appProperties:{kind:'photo',photoId:p.id,itemId:p.itemId,hash:p.hash}},o); }
    if(!plan.unchanged) await driveUpload({id:invFile&&invFile.id,name:DRIVE_INV_NAME,mime:'application/json',data:JSON.stringify(plan.inventory),appProperties:{kind:'inventory'}},o);
    for(const f of plan.deleteFiles) await driveDelete(f.id,o);
    const photoCount=plan.inventory.photos.length;
    SYNC.last={at:Date.now(),uploaded:plan.upload.length,skipped:photoCount-plan.upload.length,deleted:plan.deleteFiles.length,items:plan.inventory.items.length,photos:photoCount,cloudOnly:plan.cloudOnly,unchanged:plan.unchanged};
    await setMeta('lastBackup',SYNC.last);
    setSync('ok','');
    return SYNC.last;
  }catch(err){
    console.warn('Backup failed',err); SYNC.dirty=true;
    setSync(err instanceof AuthNeeded?'auth':'error',err.message||String(err));
    if(reason==='manual') throw err;
  }finally{
    SYNC.running=false;
    if(SYNC.again){ SYNC.again=false; if(autoBackupOn()) markDirty(); }
  }
}

async function restoreFromDrive({confirmFn=confirm}={}){
  const o={interactive:true};
  if(SYNC.running){ toast('A backup is running \u2014 try again in a moment'); return {done:false,reason:'busy'}; }
  SYNC.running=true; clearTimeout(SYNC.timer);   // no backup may run while restoring
  setSync('running','Checking your Google Drive backup\u2026');
  try{
    const files=await driveListAll(o), invFile=files.find(f=>f.name===DRIVE_INV_NAME);
    if(!invFile){ setSync('ok',''); toast('No Google Drive backup found yet'); return {done:false,reason:'none'}; }
    const remote=await (await driveDownload(invFile.id,o)).json();
    const local=await getAllItems(), plan=planRestore(local,remote);
    if(!plan.add.length&&!plan.update.length){ setSync('ok',''); toast('This device already has everything in your backup'); return {done:false,reason:'uptodate',plan}; }
    const msg=`Restore from Google Drive?\n\n\u2022 ${plan.add.length} item(s) will be added\n\u2022 ${plan.update.length} item(s) are newer in Drive and will REPLACE the copy on this phone${plan.update.length?' ('+plan.update.slice(0,5).map(u=>u.local.sku).join(', ')+(plan.update.length>5?'\u2026':'')+')':''}\n\u2022 ${plan.keepLocal.length} item(s) are newer here and will be kept\n\nItems that are only on this phone are never deleted.`;
    if(!confirmFn(msg)){ setSync('ok',''); return {done:false,reason:'cancelled',plan}; }
    const fileByPhoto=new Map(files.filter(f=>f.appProperties&&f.appProperties.kind==='photo').map(f=>[f.appProperties.photoId,f]));
    const tomb=(await getMeta('tombstones'))||{};
    SYNC.suspend=true;
    let n=0; const jobs=[...plan.add.map(r=>({r,targetId:r.id})),...plan.update.map(u=>({r:u.remote,targetId:u.local.id,old:u.local}))];
    for(const {r,targetId} of jobs){
      setSync('running',`Restoring item ${++n} of ${jobs.length}\u2026`);
      const refs=(remote.photos||[]).filter(p=>p.itemId===r.id).sort((a,b)=>a.idx-b.idx);
      const existing=await getPhotos(targetId), exById=new Map(existing.map(p=>[p.id,p])), keepIds=new Set();
      let cover=null;
      for(const ref of refs){
        let rec=exById.get(ref.id);
        if(!rec||(rec.hash&&ref.hash&&rec.hash!==ref.hash)){
          const f=fileByPhoto.get(ref.id); if(!f) continue;
          const buf=await (await driveDownload(f.id,o)).arrayBuffer();
          rec={id:ref.id,itemId:targetId,idx:ref.idx,type:ref.type||'image/jpeg',buf,hash:ref.hash};
        } else rec={...rec,itemId:targetId,idx:ref.idx};
        await reqP(os('photos','readwrite').put(rec)); keepIds.add(rec.id); if(!cover) cover=rec;
      }
      for(const p of existing) if(!keepIds.has(p.id)) await delPhoto(p.id);
      const it={...r,id:targetId,status:{...defaultStatus(),...(r.status||{})},photoCount:keepIds.size};
      it.thumb=cover?await makeThumb(photoBlob(cover)):'';
      await reqP(os('items','readwrite').put(it)); delete tomb[targetId];
    }
    await setMeta('tombstones',tomb);
    if((remote.skuCounter||0)>((await getMeta('sku'))||0)) await setMeta('sku',remote.skuCounter);
    SYNC.suspend=false;
    await refresh(); setSync('ok',''); toast(`Restored ${jobs.length} item(s) from Google Drive`);
    return {done:true,plan};
  }catch(err){ SYNC.suspend=false; setSync(err instanceof AuthNeeded?'auth':'error',err.message||String(err)); throw err; }
  finally{ SYNC.running=false; if(SYNC.dirty&&autoBackupOn()) markDirty(); }
}

/* ---- UI bits ---- */
const fmtTime = t => t ? new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : 'never';
function accountChipHTML(){
  if(!Auth.signedIn()) return Auth.enabled()?`<a class="acct" href="#/backup" id="acctChip"><span class="dot off"></span>\u2601 Sign in</a>`:'';
  const p=Auth.profile, dot={ok:'ok',idle:'ok',pending:'pend',running:'pend',error:'err',auth:'err'}[SYNC.state]||'ok';
  return `<a class="acct" href="#/backup" id="acctChip" title="${esc(p.email)}">${p.picture?`<img src="${esc(p.picture)}" alt="" referrerpolicy="no-referrer">`:`<span class="ini">${esc((p.name||'?')[0])}</span>`}<span class="nm">${esc((p.name||'').split(' ')[0])}</span><span class="dot ${dot}"></span></a>`;
}
function updateSyncUI(){
  const chip=$('#acctSlot'); if(chip) chip.innerHTML=accountChipHTML();
  const box=$('#gStatus'); if(!box) return;
  const L=SYNC.last;
  let h='';
  if(SYNC.state==='running'||SYNC.state==='pending') h=`<div class="gs pend">\u23f3 ${esc(SYNC.msg)}</div>`;
  else if(SYNC.state==='error'||SYNC.state==='auth') h=`<div class="gs err" role="alert">\u26a0 Backup problem: ${esc(SYNC.msg)}</div>`;
  h+=`<div class="gs">Last backup: <b id="lastBackup">${fmtTime(L&&L.at)}</b>${L?` \u00b7 ${L.items} items, ${L.photos} photos${L.uploaded||L.deleted?` (${L.uploaded} uploaded, ${L.skipped} unchanged${L.deleted?', '+L.deleted+' removed':''})`:' (nothing new)'}`:''}</div>`;
  if(L&&L.cloudOnly) h+=`<div class="gs pend">${L.cloudOnly} item(s) in your Drive backup aren't on this phone \u2014 tap \u201cRestore from Google Drive\u201d.</div>`;
  box.innerHTML=h;
}
function googleSectionHTML(){
  if(!Auth.enabled()) return `<fieldset><legend>Google account backup</legend>
    <button class="btn gbtn block" id="gSignIn" disabled>${GOOGLE_G}Google backup coming soon</button>
    <p class="note">Automatic backup to your own Google Drive is being set up. Until then, use the JSON backup below.</p></fieldset>`;
  if(!Auth.signedIn()) return `<fieldset><legend>Google account backup</legend>
    <button class="btn gbtn block" id="gSignIn">${GOOGLE_G}Sign in with Google</button>
    <p class="note">Backs up your items and photos automatically to a private app folder in <b>your own</b> Google Drive. Only this app can see that folder; it can't see your other Drive files. The app works fine without signing in.</p></fieldset>`;
  const p=Auth.profile;
  return `<fieldset><legend>Google account backup</legend>
    <div class="row" style="gap:12px">${p.picture?`<img class="av" src="${esc(p.picture)}" alt="" referrerpolicy="no-referrer">`:`<span class="av ini">${esc((p.name||'?')[0])}</span>`}
      <div style="min-width:0"><b>${esc(p.name)}</b><div class="hint" style="overflow:hidden;text-overflow:ellipsis">${esc(p.email)}</div></div></div>
    <div id="gStatus" style="margin-top:10px"></div>
    <div class="pbtns"><button class="btn primary" id="gBackup">\u2601 Back up now</button><button class="btn" id="gRestore">\u2b07 Restore from Google Drive</button></div>
    <label class="row" style="margin-top:12px;font-size:14px"><input type="checkbox" id="gAuto" ${localStorage.getItem('ctc-auto-backup')!=='off'?'checked':''} style="width:22px;height:22px"> Back up automatically after changes</label>
    <button class="btn sm ghost" id="gSignOut" style="margin-top:8px">Sign out</button>
    <p class="note">Signing out keeps everything on this phone. Your Drive backup stays in your Google account.</p></fieldset>`;
}
const GOOGLE_G='<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>';
function bindGoogleSection(){
  const si=$('#gSignIn'); if(si&&!si.disabled) si.onclick=async()=>{ si.disabled=true; try{ await Auth.signIn(); toast('Signed in as '+Auth.profile.name); renderBackup(); updateSyncUI(); backupNow({reason:'auto'}); }catch(e){ toast(e.message); si.disabled=false; } };
  const b=$('#gBackup'); if(b) b.onclick=async()=>{ b.disabled=true; try{ const r=await backupNow({reason:'manual'}); if(r) toast(r.unchanged&&!r.uploaded?'Backup is up to date':`Backed up \u00b7 ${r.uploaded} photo(s) uploaded`); }catch(e){ toast(e.message); } b.disabled=false; };
  const r=$('#gRestore'); if(r) r.onclick=async()=>{ r.disabled=true; try{ await restoreFromDrive(); }catch(e){ toast(e.message); } r.disabled=false; };
  const a=$('#gAuto'); if(a) a.onchange=()=>{ localStorage.setItem('ctc-auto-backup',a.checked?'on':'off'); if(a.checked&&SYNC.dirty) markDirty(); };
  const so=$('#gSignOut'); if(so) so.onclick=()=>{ if(!confirm('Sign out of Google? Your items stay on this phone and in your Drive backup.')) return; Auth.signOut(); clearTimeout(SYNC.timer); setSync('idle',''); renderBackup(); toast('Signed out'); };
  updateSyncUI();
}

/* ---------- Backup / export / import ---------- */
function renderBackup(){
  $('#app').innerHTML=`
  <header class="top"><h1>Backup &amp; settings</h1><p class="tag">your items live on this phone${Auth.signedIn()?' + your Google Drive':''}</p></header>
  ${googleSectionHTML()}
  <fieldset class="sites"><legend>Your selling sites</legend>
    ${PKEYS.map(k=>`<label><input type="checkbox" data-site="${k}" ${activeKeys().includes(k)?'checked':''}> <span><b>${PLATFORMS[k].name}</b> <span class="hint">\u00b7 ${POST_MODES[PLATFORMS[k].mode].short}</span></span></label>`).join('')}
    <p class="note">Only checked sites show on items and in price comparisons. Bot sites aren\u2019t connected yet \u2014 you can post those yourself too.</p>
  </fieldset>
  <fieldset><legend>Export</legend>
    <button class="btn primary block" id="expJson">\u2b07 Full backup (JSON, with photos)</button>
    <p class="note">Restores everything later or on a new phone. Save it to Files / iCloud / Google Drive.</p>
    <button class="btn block" id="expCsv" style="margin-top:12px">\u2b07 Inventory spreadsheet (CSV, no photos)</button>
  </fieldset>
  <fieldset><legend>Import</legend>
    <label class="btn block pick">\u2b06 Restore from JSON backup<input type="file" accept="application/json,.json" id="impJson"></label>
    <p class="note">Merges into current inventory; items with the same ID are replaced.</p>
    <label class="btn block pick" style="margin-top:12px">\u2b06 Import comps by SKU (JSON)<input type="file" accept="application/json,.json" id="impComps"></label>
    <p class="note">Format: <code>{"V-0001": {"ebay": {"low":20,"median":35,"high":60,"count":12}}}</code></p>
  </fieldset>
  <fieldset><legend>Storage</legend><p class="note" id="storeInfo">Checking\u2026</p>
    <p class="note">Tip: on iPhone, Share \u2192 \u201cAdd to Home Screen\u201d so Safari is less likely to clear data, and back up weekly.</p></fieldset>
  <p class="foot"><a href="privacy.html">Privacy</a> \u00b7 <a href="terms.html">Terms</a> \u00b7 ${esc(APP_NAME)}</p>`;
  $('#expJson').onclick=exportJSON; $('#expCsv').onclick=exportCSV;
  $('#impJson').onchange=importJSON; $('#impComps').onchange=importComps;
  bindGoogleSection();
  $$('[data-site]').forEach(c=>c.onchange=()=>{ setSiteOn(c.dataset.site,c.checked); toast(`${PLATFORMS[c.dataset.site].name} ${c.checked?'shown':'hidden'}`); });
  (async()=>{ let s=`${ITEMS.length} items.`; try{ if(navigator.storage?.estimate){ const e=await navigator.storage.estimate(); s+=` Using ~${(e.usage/1048576).toFixed(1)} MB.`; } if(navigator.storage?.persisted) s+=(await navigator.storage.persisted())?' Storage is persistent \u2713':' Storage not marked persistent (browser may clear it if space runs low).'; }catch(e){} $('#storeInfo').textContent=s; })();
}
const stamp=()=>new Date().toISOString().slice(0,10);
const slug=APP_NAME.toLowerCase().replace(/[^a-z0-9]+/g,'-');
async function buildBackupBlob(){
  const photos=await getAllPhotos(), parts=[];
  const head=JSON.stringify({app:APP_NAME,format:'closet-to-cash-backup',version:1,exportedAt:new Date().toISOString(),skuCounter:(await getMeta('sku'))||0,items:ITEMS});
  parts.push(head.slice(0,-1)+',"photos":[');
  for(let i=0;i<photos.length;i++){ const p=photos[i]; parts.push((i?',':'')+JSON.stringify({id:p.id,itemId:p.itemId,idx:p.idx,data:await blobToDataURL(photoBlob(p))})); }
  parts.push(']}');
  return {blob:new Blob(parts,{type:'application/json'}),photoCount:photos.length};
}
async function exportJSON(){
  toast('Preparing backup\u2026');
  const {blob,photoCount}=await buildBackupBlob();
  downloadBlob(blob,`${slug}-backup-${stamp()}.json`);
  toast(`Backup saved: ${ITEMS.length} items, ${photoCount} photos`);
}
function buildCSV(){
  const cols=['sku','brand','type','era','size','color','material','keywords','pit','length','waist','inseam','condition','flaws','cost','price','soldPrice'];
  const head=[...cols,...PKEYS.flatMap(p=>[p+'_status',p+'_url']),'created'];
  const cell=v=>{ v=v==null?'':String(v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const rows=ITEMS.slice().sort((a,b)=>a.createdAt-b.createdAt).map(it=>[...cols.map(c=>c==='condition'?condLabel(it.condition):c==='soldPrice'?(st(it).sold?soldPrice(it):''):it[c]),
    ...PKEYS.flatMap(p=>[it.status?.[p]?.state||'none',it.status?.[p]?.url||'']), new Date(it.createdAt).toISOString()].map(cell).join(','));
  return '\ufeff'+[head.join(','),...rows].join('\r\n');
}
function exportCSV(){ downloadBlob(new Blob([buildCSV()],{type:'text/csv'}),`${slug}-inventory-${stamp()}.csv`); toast('CSV exported'); }
async function importJSON(e){
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const d=JSON.parse(await f.text());
    if(!d||!Array.isArray(d.items)) throw new Error('Not a backup file');
    if(!confirm(`Import ${d.items.length} items and ${(d.photos||[]).length} photos into this device?`)) return;
    const tb=(await getMeta('tombstones'))||{}; for(const it of d.items){ if(it.id) delete tb[it.id]; } await setMeta('tombstones',tb);
    for(const it of d.items){ if(!it.id) continue; it.status={...defaultStatus(),...(it.status||{})}; if(it.comps) try{ it.comps=normalizeComps(it.comps); }catch(_){ it.comps={}; } await putItem(it); }
    for(const p of (d.photos||[])){ if(!p.id||!p.data) continue; const {buf,type}=dataURLToBuf(p.data); await putPhoto({id:p.id,itemId:p.itemId,idx:p.idx||0,type,buf}); }
    let maxN=d.skuCounter||0; d.items.forEach(it=>{ const m=String(it.sku||'').match(/(\d+)$/); if(m) maxN=Math.max(maxN,+m[1]); });
    if(maxN>((await getMeta('sku'))||0)) await setMeta('sku',maxN);
    await refresh(); toast(`Imported ${d.items.length} items`); location.hash='#/'; route();
  }catch(err){ toast('Import failed: '+err.message); }
}
async function importComps(e){
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const d=JSON.parse(await f.text()); let n=0; const miss=[];
    for(const sku of Object.keys(d)){ const it=ITEMS.find(i=>i.sku===sku); if(!it){ miss.push(sku); continue; } it.comps={...(it.comps||{}),...normalizeComps(d[sku])}; it.compsUpdatedAt=Date.now(); await putItem(it); n++; }
    await refresh(); toast(`Comps updated for ${n} item(s)${miss.length?` \u00b7 not found: ${miss.slice(0,3).join(', ')}`:''}`);
  }catch(err){ toast('Import failed: '+err.message); }
}

/* ---------- home-screen icon (PNG generated at runtime; iOS ignores SVG touch icons) ---------- */
function addTouchIcon(){
  try{
    const c=document.createElement('canvas'); c.width=c.height=180; const x=c.getContext('2d');
    x.fillStyle='#7a3a26'; x.fillRect(0,0,180,180);
    x.strokeStyle='#f6efe3'; x.lineWidth=9; x.lineCap='round'; x.lineJoin='round';
    x.beginPath(); x.arc(90,52,16,Math.PI*0.95,Math.PI*0.5,false); x.lineTo(90,82); x.lineTo(148,124); x.lineTo(32,124); x.closePath(); x.stroke();
    x.fillStyle='#c48f2c'; x.font='bold 34px Georgia,serif'; x.textAlign='center'; x.fillText('$',90,164);
    const l=document.createElement('link'); l.rel='apple-touch-icon'; l.href=c.toDataURL('image/png'); document.head.appendChild(l);
  }catch(e){}
}

/* ---------- boot ---------- */
(async function init(){
  document.title=APP_NAME;
  const m=document.querySelector('meta[name="apple-mobile-web-app-title"]'); if(m) m.content=APP_NAME;
  if(location.protocol==='file:') addTouchIcon();   // hosted copy uses icon-180.png instead
  else {
    // Web app manifest + service worker only work over http(s) (e.g. GitHub Pages), not file://
    const l=document.createElement('link'); l.rel='manifest'; l.href='manifest.webmanifest'; document.head.appendChild(l);
    if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(e=>console.warn('SW registration failed',e)));
  }
  try{ db=await openDB(); await refresh(); }
  catch(err){ $('#app').innerHTML=`<div class="empty"><h2>Storage unavailable</h2><p>${esc(err.message)}. Private browsing or some file previewers block storage \u2014 open this page in Safari/Chrome normally.</p></div>`; return; }
  Auth.load();
  try{ SYNC.last=(await getMeta('lastBackup'))||null; }catch(e){}
  document.addEventListener('visibilitychange',flushOnHide); window.addEventListener('pagehide',()=>{ if(SYNC.dirty&&autoBackupOn()) backupNow({reason:'hide'}); });
  window.addEventListener('online',()=>{ if(SYNC.dirty&&autoBackupOn()) markDirty(); });
  window.addEventListener('hashchange',route);
  route();
})();
</script>
