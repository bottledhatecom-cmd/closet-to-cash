<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hanger Hustle</title>
<meta name="theme-color" content="#7a3a26">
<meta name="description" content="Offline vintage clothing inventory and cross-listing helper">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hanger Hustle">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237a3a26'/%3E%3Cpath d='M32 14a6 6 0 0 1 6 6c0 3-2 4-4 5l-2 1v3l20 14c2 1 1 4-1 4H13c-2 0-3-3-1-4l20-14' fill='none' stroke='%23f7efe1' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!--
  Hanger Hustle - single-file, offline vintage inventory + cross-listing helper.

  HONEST NOTE ON WHAT THIS DOES / DOESN'T DO:
  - It does NOT post listings by itself. Posting plan (2026-10-21): a separate bot will post to eBay and
    Etsy via their official APIs and to Depop via its Selling API (Depop's Terms allow crosslisting tools);
    Poshmark, Mercari, Vinted, FB Marketplace and Grailed ban bots, so she publishes those herself from a
    pre-filled listing ("Post to ..." button). The bot is not built yet; "Queue for bot" only marks items.
  - What it DOES: stores your items + photos on THIS device (IndexedDB), generates platform-tailored
    titles/descriptions you copy-paste, lets you push photos to the marketplace app via the share
    sheet, and tracks where each item is listed/sold so you remember to delist.
  - Optional Google sign-in backs up to the user's OWN Drive (hidden appDataFolder) - still no backend.
  - Hosted copy (GitHub Pages) adds manifest.webmanifest + sw.js so it installs and opens offline.
  - Data lives only in this browser on this device. Use Backup > "Full backup (JSON)" regularly.
  - Fee defaults and character limits are approximations as of 2026 and change; edit them below.
  - Comp prices are entered/pasted by you; nothing is scraped. "Search sold comps" just opens
    each site's search page in a new tab.
-->
<style>
:root{
  --cream:#f6efe3; --paper:#fffaf2; --ink:#2d2420; --muted:#665548; --line:#e4d6c3;
  --rust:#a24c2c; --deep:#7a3a26; --sage:#5f7a5a; --sage-bg:#e6eee1; --mustard:#c48f2c;
  --red:#b3261e; --red-bg:#fde8e4; --gold-bg:#fbf1d9; --badge:#805a12;
  --radius:16px; --tap:48px; --tap-min:44px;
  /* HH-FontSize type scale (rem; 1rem = browser default, normally 16px): body 1rem, secondary .875rem (14px), smallest badge .8125rem (13px) */
  --fs-body:1rem; --fs-sec:.875rem; --fs-label:.9375rem; --fs-badge:.8125rem;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font:100%/1.45 var(--sans)}
small{font-size:var(--fs-sec)}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));
  background-image:radial-gradient(rgba(122,58,38,.05) 1px,transparent 1px);background-size:14px 14px}
a{color:var(--deep)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.2px;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
.top{padding:calc(14px + env(safe-area-inset-top)) 0 6px;text-align:center}
.top h1{font-size:1.875rem;color:var(--deep)}
.top .tag{margin:2px 0 0;color:var(--muted);font-family:var(--serif);font-style:italic;font-size:var(--fs-label)}
.ornament{display:block;margin:6px auto 0;width:120px;height:8px;color:var(--mustard)}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;justify-content:space-between;
  padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:rgba(246,239,227,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);margin:0 -14px 12px}
.bar .ttl{font-family:var(--serif);font-weight:600;font-size:1.125rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;
  min-height:var(--tap);padding:0 18px;font:600 var(--fs-body) var(--sans);display:inline-flex;align-items:center;justify-content:center;
  gap:6px;text-decoration:none;cursor:pointer;touch-action:manipulation;text-align:center}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--deep);border-color:var(--deep);color:#fff}
.btn.rust{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:var(--tap-min);padding:4px 12px;font-size:var(--fs-body);line-height:1.2}
.btn.danger{color:var(--red);border-color:#e9b8b2}
.btn.block{width:100%}
.btn[disabled]{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font:700 1.25rem var(--serif);color:var(--deep)}
.stat span{font-size:var(--fs-sec);color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
@media (min-width:560px){.stats{grid-template-columns:repeat(5,1fr)}}
.alert{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--red-bg);color:var(--red);
  border:1.5px solid #f0b4aa;border-radius:14px;padding:12px 14px;font:600 var(--fs-body) var(--sans);margin:10px 0}
.alert .x{font-size:1.25rem;line-height:1}
.alert small{display:block;font-weight:500;font-size:var(--fs-sec);color:#7d2a22}
.search{width:100%;min-height:var(--tap);border-radius:999px;border:1px solid var(--line);background:var(--paper);padding:0 18px;font-size:var(--fs-body)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:var(--tap-min);min-width:var(--tap-min);padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);
  font:600 var(--fs-body) var(--sans);color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.warn.on{background:var(--red);border-color:var(--red)}
.row{display:flex;gap:8px;align-items:center}
.row.between{justify-content:space-between}
select,input,textarea{font:var(--fs-body) var(--sans);color:var(--ink)}
.sel{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);padding:0 10px}
.items{display:grid;gap:12px;margin:12px 0 20px}
.items.grid{grid-template-columns:repeat(2,1fr)}
@media (min-width:600px){.items.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;display:block;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  text-decoration:none;color:inherit;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.card .thumb{aspect-ratio:4/5;background:#efe4d4;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .ci{padding:8px 10px 10px}
.sku{font:600 var(--fs-badge) var(--sans);letter-spacing:1px;color:var(--muted)}
.card .t{font-weight:600;font-size:var(--fs-body);line-height:1.3;margin:2px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font:700 1.125rem var(--serif);color:var(--deep)}
.pchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pc{font:700 var(--fs-badge) var(--sans);padding:2px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted);background:#fff}
.pc.listed{background:var(--sage-bg);border-color:#b9cdb2;color:#35502f}
.pc.sold{background:var(--rust);border-color:var(--rust);color:#fff}
.pc.delist{background:var(--red-bg);border-color:#f0b4aa;color:var(--red);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(179,38,30,.15)}}
.ribbon{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font:700 var(--fs-badge) var(--sans);padding:4px 8px;border-radius:8px;letter-spacing:.5px;z-index:1}
.ribbon.sold{background:var(--rust)}
.items.list .card{display:flex}
.items.list .card .thumb{width:96px;flex:0 0 96px;aspect-ratio:auto;min-height:110px}
.items.list .card .ci{flex:1;min-width:0}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty h2{color:var(--deep);margin-bottom:6px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,250,242,.97);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
.nav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font:600 var(--fs-sec) var(--sans);min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav a.on{color:var(--deep)}
.nav a .i{font-size:1.25rem;line-height:1}
.nav a.add{flex:0 0 auto}
.nav a.add .plus{width:58px;height:58px;border-radius:50%;background:var(--deep);color:#fff;font-size:1.875rem;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(122,58,38,.35);margin-top:-26px}
fieldset{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);margin:0 0 14px;padding:12px 14px 14px;min-width:0}
legend{font:600 1.0625rem var(--serif);color:var(--deep);padding:0 6px}
.f{display:block;margin:10px 0 0}
.f>span{display:block;font-size:var(--fs-label);font-weight:600;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea,.inp{width:100%;min-height:var(--tap);border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px}
.f textarea,textarea.inp{min-height:84px;resize:vertical;line-height:1.4}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#efe4d4}
.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;border:0;border-radius:999px;width:var(--tap-min);height:var(--tap-min);font-size:1.125rem;background:rgba(0,0,0,.6);color:#fff}
.ph .rm{top:4px;right:4px}.ph .cv{bottom:4px;left:4px}
.ph .badge{position:absolute;bottom:6px;right:6px;background:var(--badge);color:#fff;font:700 var(--fs-badge) var(--sans);padding:2px 6px;border-radius:6px}
.pickers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{position:relative;overflow:hidden}
.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.aibox{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.aibtn{font-size:1.0625rem;min-height:52px}
.plusb{font:700 var(--fs-badge) var(--sans);background:#fff;color:var(--rust);border-radius:999px;padding:2px 8px;letter-spacing:.3px}
.aimsg{margin:10px 0 0;padding:12px 14px;border-radius:14px;font-size:var(--fs-body);line-height:1.45;background:#fff;border:1px solid var(--line)}
.aimsg.err{background:var(--red-bg);border-color:#f0b4aa;color:#7d2a22}
.aimsg.ok{background:var(--sage-bg);border-color:#b9cdb2;color:#2f4729}
.aimsg b{font-weight:700}
.aiquota{display:block;margin-top:6px;font-size:var(--fs-sec);font-weight:600}
.aispin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--rust);border-radius:50%;animation:aispin .8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes aispin{to{transform:rotate(360deg)}}
.qcards{display:grid;gap:10px;margin-top:10px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.qcard .qq{font:600 1.0625rem var(--sans);margin:0 0 8px;line-height:1.35}
.qcard .qo{display:flex;flex-wrap:wrap;gap:8px}
.qcard .qo .chip{font-size:var(--fs-body);min-height:var(--tap)}
.qcard.done{background:var(--sage-bg);border-color:#b9cdb2}
.qcard .qa{font-size:var(--fs-body);font-weight:600;color:#2f4729}
.aifill{background:#fff8e6!important;border-color:#e3c26b!important}
#aiGsi{margin-top:10px;min-height:44px}#aiGsi:empty{display:none}
.sticky-save{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));padding:10px 0;background:linear-gradient(transparent,var(--cream) 35%)}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;padding:0 14px 6px}
.gallery img{height:300px;max-width:80vw;object-fit:cover;border-radius:14px;scroll-snap-align:start;flex:0 0 auto;background:#efe4d4}
.nophoto{height:160px;border-radius:14px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);width:100%}
.summary{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:12px 0}
.summary h2{font-size:1.3125rem;line-height:1.25}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:var(--fs-body);margin-top:10px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.sec{font-size:1.25rem;color:var(--deep);margin:22px 0 4px}
.sub{color:var(--muted);font-size:var(--fs-sec);margin:0 0 10px}
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 14px;border-top:5px solid var(--pc,#999)}
.pcard.is-delist{border-color:#f0b4aa;background:#fff6f4;box-shadow:0 0 0 3px rgba(179,38,30,.12)}
.pcard .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pcard h3{font-size:1.1875rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;min-height:var(--tap-min);min-width:var(--tap-min);padding:0 12px;font:600 var(--fs-body) var(--sans);color:var(--muted)}
.seg button.on[data-s=none]{background:#eee6da;color:var(--ink)}
.seg button.on[data-s=listed]{background:var(--sage);color:#fff}
.seg button.on[data-s=sold]{background:var(--rust);color:#fff}
.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:var(--fs-label);font-weight:600;color:var(--muted);margin:12px 0 4px}
.cnt{font:600 var(--fs-sec) var(--sans);color:#4a6346;white-space:nowrap}
.cnt.over{color:var(--red)}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.note{font-size:var(--fs-sec);color:var(--muted);margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;font-size:var(--fs-body);transition:.25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.comps{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:14px}
.ctable{width:100%;border-collapse:collapse;font-size:var(--fs-sec)}
.ctable th{font:600 var(--fs-sec) var(--sans);text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.ctable th:first-child,.ctable td:first-child{text-align:left}
.ctable td{text-align:right;padding:8px 4px;border-bottom:1px solid #f0e6d8;white-space:nowrap}
.ctable tr.best td{background:var(--gold-bg);font-weight:700}
.ctable tr.best td:first-child::before{content:"\2605 ";color:var(--mustard)}
.ctable td:first-child{white-space:normal}
.suggest{display:flex;gap:10px;align-items:center;background:var(--gold-bg);border:1px solid #ecd39a;border-radius:12px;padding:10px 12px;margin:0 0 10px}
.suggest b{font:700 1.375rem var(--serif);color:var(--deep)}
details.ce{border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:10px}
details.ce summary{min-height:46px;display:flex;align-items:center;padding:0 12px;font-weight:600;cursor:pointer}
details.ce .in{padding:0 12px 12px}
.ce .g6{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ce .g6 label{font-size:var(--fs-sec);color:var(--muted);font-weight:600}
.ce .g6 input{width:100%;min-height:var(--tap-min);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.sbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hint{font-size:var(--fs-sec);color:var(--muted)}
.mode{display:inline-block;margin-top:3px;font:700 var(--fs-badge) var(--sans);padding:3px 8px;border-radius:999px;letter-spacing:.2px}
.mode.bot{background:#e8eef9;color:#1f4b8f}.mode.you{background:var(--gold-bg);color:#7a5a12}
.checklist{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:var(--fs-body)}
.checklist ol{margin:0;padding-left:20px}.checklist li{margin:4px 0}
.checklist .stepcard{margin:0 0 8px;font-size:var(--fs-body);line-height:1.35}
details.ed{margin-top:10px;border-top:1px solid var(--line)}details.ed>summary{min-height:44px;display:flex;align-items:center;font-weight:600;font-size:var(--fs-body);color:var(--muted);cursor:pointer}
/* HH-Closets: a closet per site + All; per-site Not posted / Listed / Sold on each card */
.closets{padding-top:12px}
.chip .n{display:inline-block;margin-left:6px;font-weight:700}
.closets .chip{font-size:var(--fs-body)}
.closets .chip.on{background:var(--deep);border-color:var(--deep)}
.items.closet{grid-template-columns:1fr}
.ccard{display:block}
.ccard .clink{display:flex;color:inherit;text-decoration:none}
.ccard .clink .thumb{width:96px;flex:0 0 96px;aspect-ratio:auto;min-height:110px}
.ccard .ci{flex:1;min-width:0}
.cstate{display:inline-block;margin-top:4px;font:700 var(--fs-sec) var(--sans);padding:2px 8px;border-radius:999px;background:#eee6da;color:var(--ink)}
.cstate.listed{background:var(--sage-bg);color:#35502f}.cstate.sold{background:var(--rust);color:#fff}.cstate.delist{background:var(--red-bg);color:var(--red)}
.cseg{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.cseg button{appearance:none;border:0;background:#fff;color:var(--ink);min-height:52px;padding:4px 6px;font:600 var(--fs-body)/1.15 var(--sans);cursor:pointer;touch-action:manipulation}
.cseg button+button{border-left:1px solid var(--line)}
.cseg button.on[data-cs=none]{background:#eee6da;color:var(--ink);box-shadow:inset 0 -4px 0 var(--muted)}
.cseg button.on[data-cs=listed]{background:var(--sage);color:#fff}
.cseg button.on[data-cs=sold]{background:var(--rust);color:#fff}
.alert .dh{display:block;font-size:1.125rem;margin-bottom:2px}
.dlist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.drow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1px solid #f0b4aa;border-radius:12px;padding:8px;color:var(--ink)}
.drow>b{flex:1 1 100%;font-size:var(--fs-body)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(45,36,32,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--paper);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.postask{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:#fff;border-radius:16px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:560px;margin:0 auto;font-size:var(--fs-body)}
.postask>span{flex:1 1 100%}.postask .btn{flex:1 1 auto}
/* HH-CopyFields: one Copy button per field, in each site's sell-form order */
details.cf{margin-top:10px;border-top:1px solid var(--line)}
details.cf>summary{min-height:var(--tap-min);display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;font-size:var(--fs-body);color:var(--deep);cursor:pointer;flex-wrap:wrap}
.cfprog{font:600 var(--fs-sec) var(--sans);color:#35502f}

<script>

/* ===================== CONFIG (edit freely) ===================== */

const TYPES = ['dress','top','blouse','jacket','coat','jeans','pants','skirt','sweater','t-shirt','shoes','bag','accessory','other'];
const TYPE_LABEL = {'t-shirt':'T-Shirt'};
const ERAS = ['40s','50s','60s','70s','80s','90s','Y2K','2010s','Unknown'];
const CONDITIONS = [['nwt','New with tags'],['excellent','Excellent'],['verygood','Very good'],['good','Good'],['fair','Fair']];

const POST_MODES = {

  prefill:  {label:'She publishes (pre-filled)',        short:'You publish'},

/* Character limits: approximations; marketplaces change these. null = no meaningful limit.
   on = shown by default (she can toggle sites in Settings). */
const PLATFORMS = {
  poshmark:{name:'Poshmark', short:'PM', color:'#7f0353', create:'https://poshmark.com/create-listing', titleMax:80, descMax:1500, mode:'prefill', on:true},
  ebay:    {name:'eBay',     short:'eB', color:'#0064d2', create:'https://www.ebay.com/sl/prelist/suggest', titleMax:80, descMax:null, mode:'api', on:true,
            modeNote:'Bot will post through eBay\u2019s official Sell (Inventory) API once Michael sets up the eBay developer app.'},
  depop:   {name:'Depop',    short:'Dp', color:'#ff2300', create:'https://www.depop.com/products/create/', titleMax:null, descMax:1000, mode:'crosslist', on:true,
            modeNote:'Depop\u2019s Terms allow crosslisting tools if you remove the item promptly when it sells elsewhere. The bot will use Depop\u2019s official Selling API (access by request: business@depop.com); a bot clicking through the Depop website itself is not allowed.'},
  vinted:  {name:'Vinted',   short:'Vt', color:'#007782', create:'https://www.vinted.com/items/new',  titleMax:100, descMax:2000, mode:'prefill', on:true},
  mercari: {name:'Mercari',  short:'Mc', color:'#5356ee', create:'https://www.mercari.com/sell/',     titleMax:80, descMax:1000, mode:'prefill', on:true},
  etsy:    {name:'Etsy',     short:'Et', color:'#f1641e', create:'https://www.etsy.com/your/shops/me/listing-editor/create', titleMax:140, descMax:null, tagsMax:13, tagLen:20, mode:'api', on:true,
            modeNote:'Bot will post through Etsy\u2019s official Open API v3 once Michael registers an Etsy app for her shop. Etsy \u201cvintage\u201d = at least 20 years old.'},
  facebook:{name:'FB Marketplace', short:'FB', color:'#1877f2', create:'https://www.facebook.com/marketplace/create/item', titleMax:100, descMax:null, mode:'prefill', on:false,
            modeNote:'No listing API for individuals and Meta bans automated access, so you publish it. Great for local pickup (no fee).'},
  grailed: {name:'Grailed',  short:'Gr', color:'#111111', create:'https://www.grailed.com/sell', titleMax:60, descMax:null, mode:'prefill', on:false,
            modeNote:'Mostly menswear/streetwear. Grailed bans third-party tools without written consent, so you publish it.'},
};
const PKEYS = Object.keys(PLATFORMS);
const FEES_CHECKED = '2026-10-21';
function activeKeys(){ let on=null; try{ on=JSON.parse(localStorage.getItem('ctc-sites')||'null'); }catch(e){}
  return PKEYS.filter(k=> on && on[k]!=null ? on[k] : PLATFORMS[k].on); }
function setSiteOn(k,v){ let on={}; try{ on=JSON.parse(localStorage.getItem('ctc-sites')||'{}')||{}; }catch(e){} on[k]=!!v; localStorage.setItem('ctc-sites',JSON.stringify(on)); }
// sites to show for an item: the ones she uses + any where this item already has a status
const shownKeys = it => PKEYS.filter(k=>activeKeys().includes(k) || (it&&it.status&&it.status[k]&&it.status[k].state!=='none'));   // date fee defaults below were last checked against each site's fee page

/* Seller fee defaults (US, approximate, 2026). pct = % of sale, fixed = $ per order.
   Poshmark is special: flat $2.95 under $15, 20% at $15+ (used unless you override pct/fixed). */
const FEE_DEFAULTS = {
  ebay:    {pct:13.6, fixed:0.40, note:'~13.6% final value fee + $0.40/order'},
  poshmark:{pct:null, fixed:null, note:'$2.95 flat under $15, 20% at $15+'},
  mercari: {pct:10,   fixed:0,    note:'10% selling fee'},
  depop:   {pct:3.3,  fixed:0.45, note:'0% seller fee (US); ~3.3% + $0.45 processing'},
  vinted:  {pct:0,    fixed:0,    note:'0% seller fee (buyer pays)'},
  etsy:    {pct:9.5,  fixed:0.45, note:'6.5% transaction + 3% + $0.25 processing + $0.20 listing (US)', checked:'2026-10-21'},
  facebook:{pct:10,   fixed:0,    note:'Local pickup $0; shipped 10% (min $0.80) incl. shipping+tax', checked:'2026-10-21'},
  grailed: {pct:null, fixed:null, note:'6% under $120 (min $1.99), 9% at $120+, plus 3.49% + $0.49 processing', checked:'2026-10-21'},
};
/* "Find prices" search links. {q} = URL-encoded search terms. sold:true = the link opens SOLD/completed results.
   Patterns checked 2026-10-21 (see HANDOFF). These are links she taps herself; the app never fetches these sites. */
const PRICE_SEARCH = {
  ebay:    {url:'https://www.ebay.com/sch/i.html?_nkw={q}&LH_Sold=1&LH_Complete=1&_sop=13', sold:true,  note:'Sold items, newest first (eBay shows ~90 days)'},
  poshmark:{url:'https://poshmark.com/search?query={q}&availability=sold_out',            sold:true,  note:'Sold listings'},
  mercari: {url:'https://www.mercari.com/search/?keyword={q}&status=sold_out',             sold:true,  note:'Sold listings'},
  grailed: {url:'https://www.grailed.com/sold?query={q}',                                   sold:true,  note:'Sold listings (Grailed asks you to log in)'},
  depop:   {url:'https://www.depop.com/search/?q={q}',                                      sold:false, note:'No sold filter: these are asking prices'},
  vinted:  {url:'https://www.vinted.com/catalog?search_text={q}',                           sold:false, note:'Vinted hides sold items: asking prices'},
  etsy:    {url:'https://www.etsy.com/search?q={q}',                                        sold:false, note:'Etsy has no sold search: asking prices'},
  facebook:{url:'https://www.facebook.com/marketplace/search/?query={q}',                   sold:false, note:'Asking prices near you'},
};
const COMP_SEARCH = Object.fromEntries(Object.entries(PRICE_SEARCH).map(([k,v])=>[k,v.url]));   // kept for older code paths
const searchURL = (p,q) => PRICE_SEARCH[p].url.replace('{q}',encodeURIComponent(q));
const COMP_SOURCES = {manual:'you', 'ebay-browse':'eBay API', 'etsy-api':'Etsy API', import:'import', scout:'scout'};

/* ===================== helpers ===================== */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if(v===''||v==null) return null; const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?null:n; };
const money = n => (n==null||isNaN(n)) ? '\u2014' : '$'+Number(n).toFixed(2).replace(/\.00$/,'');
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : '';
const titleCase = s => String(s||'').replace(/(^|[\s\-\/])([a-z])/g,(m,a,c)=>a+c.toUpperCase());
const typeLabel = t => TYPE_LABEL[t] || titleCase(t||'');
const condLabel = c => (CONDITIONS.find(x=>x[0]===c)||[,''])[1];
const kwList = it => String(it.keywords||'').split(/[,#\n]+/).map(s=>s.trim()).filter(Boolean);
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2400); }

/* ===================== IndexedDB ===================== */
let db;
const reqP = r => new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
function openDB(){
  return new Promise((res,rej)=>{
    if(!('indexedDB' in window)) return rej(new Error('IndexedDB not available in this browser'));
    const r = indexedDB.open(DB_NAME,1);
    r.onupgradeneeded = () => {
      const d=r.result;
      d.createObjectStore('items',{keyPath:'id'});
      d.createObjectStore('photos',{keyPath:'id'}).createIndex('itemId','itemId');
      d.createObjectStore('meta',{keyPath:'k'});
    };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
const os = (name,mode='readonly') => db.transaction(name,mode).objectStore(name);
const getAllItems = () => reqP(os('items').getAll());
const putItem = it => reqP(os('items','readwrite').put(it)).then(r=>{ markDirty(); return r; });
const getMeta = k => reqP(os('meta').get(k)).then(r=>r?r.v:undefined);
const setMeta = (k,v) => reqP(os('meta','readwrite').put({k,v}));
// Photos are stored as ArrayBuffer + mime type (most compatible across Safari versions).
async function getPhotos(itemId){ const ps=await reqP(os('photos').index('itemId').getAll(itemId)); return ps.sort((a,b)=>a.idx-b.idx); }
const getAllPhotos = () => reqP(os('photos').getAll());
const putPhoto = async p => { if(!p.hash&&p.buf) p.hash=await hashBuf(p.buf); const r=await reqP(os('photos','readwrite').put(p)); markDirty(); return r; };
const delPhoto = id => reqP(os('photos','readwrite').delete(id)).then(r=>{ markDirty(); return r; });
const photoBlob = p => new Blob([p.buf],{type:p.type||'image/jpeg'});
async function deleteItem(id){
  for(const p of await getPhotos(id)) await delPhoto(p.id);
  await reqP(os('items','readwrite').delete(id));
  const t=(await getMeta('tombstones'))||{}; t[id]=Date.now(); await setMeta('tombstones',t);   // so the Drive backup drops it too
  markDirty();
}
function nextSku(){
  return new Promise((res,rej)=>{
    const t=db.transaction('meta','readwrite'), s=t.objectStore('meta'), g=s.get('sku');
    let n;
    g.onsuccess=()=>{ n=(g.result?g.result.v:0)+1; s.put({k:'sku',v:n}); };
    t.oncomplete=()=>res(SKU_PREFIX+String(n).padStart(4,'0'));
    t.onerror=()=>rej(t.error);
  });
}

/* ===================== images ===================== */
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('Could not read image (unsupported format?)')); i.src=src; }); }
async function resizeImage(blob,max,q){
  const url=URL.createObjectURL(blob);
  try{
    const img=await loadImg(url);   // modern browsers apply EXIF orientation when drawing
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.max(1,Math.round(img.naturalWidth*s)), h=Math.max(1,Math.round(img.naturalHeight*s));
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
    let out=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
    if(!out) out=new Blob([dataURLToBuf(c.toDataURL('image/jpeg',q)).buf],{type:'image/jpeg'});
    c.width=c.height=0;
    return out;
  } finally { URL.revokeObjectURL(url); }

    if(asking){ base*=0.9; why.push('asking prices, \u221210%'); }
    let target=base*cond[0]; if(cond[0]!==1) why.push(cond[1]);
    if(c.low!=null && target<c.low){ target=c.low; why.push('kept at the low end'); }
    if(c.high!=null && target>c.high){ target=c.high; why.push('capped at the high end'); }
    const room=OFFER_ROOM[p]||0, list=Math.round(target*(1+room)); if(room) why.push(`+${Math.round(room*100)}% room for offers`);
    const n=c.count||1, conf=n>=8?'good':n>=3?'fair':'thin';
    rows.push({p,c,target:Math.round(target),list,net:netAt(p,Math.round(target),c),conf,why,asking});
    const w=n*(asking?0.5:1); ss+=target*w; sw+=w; if(asking) nAsk+=n; else nSold+=n;
  }
  if(!sw) return null;
  const target=Math.round(ss/sw), list=Math.round(target*1.05);
  // sites with no comps: estimate from the overall number (shown greyed)
  for(const p of shownKeys(it)) if(!rows.find(r=>r.p===p)){ const room=OFFER_ROOM[p]||0; rows.push({p,c:comps[p]||{},target,list:Math.round(target*(1+room)),net:netAt(p,target,comps[p]||{}),conf:'none',why:['no prices for this site yet, based on the others'],est:true}); }
  const order=shownKeys(it); rows.sort((a,b)=>order.indexOf(a.p)-order.indexOf(b.p));
  const real=rows.filter(r=>!r.est), bestNet=real.reduce((a,b)=>b.net>a.net?b:a,real[0]);
  const reasons=[];
  reasons.push(`Based on ${[nSold?`${nSold} sold`:'',nAsk?`${nAsk} asking`:''].filter(Boolean).join(' + ')} price${nSold+nAsk===1?'':'s'} from ${real.map(r=>PLATFORMS[r.p].name).join(', ')}${nAsk?' (asking prices count half, since items usually sell below asking)':''}.`);
  reasons.push(`Expect it to sell around ${money(target)}${cond[0]!==1?` (${cond[1]})`:''}.`);
  reasons.push(`List at about ${money(list)} to leave a little room for offers.`);
  if(bestNet) reasons.push(`Most take-home: ${PLATFORMS[bestNet.p].name}, about ${money(bestNet.net)} after fees.`);
  if(nSold+nAsk<5) reasons.push('Only a few prices so far: check one or two more sites before trusting this.');
  if(it.cost!=null && it.cost>0 && bestNet) reasons.push(`Profit after your ${money(it.cost)} cost: about ${money(bestNet.net-it.cost)}.`);
  return {target,list,rows,reasons,bestNet,nSold,nAsk};
}

async function copyText(text){

  const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';

const UA_=navigator.userAgent||'';

const IS_ANDROID=/Android/i.test(UA_);

const DL_STAGGER_MS=180, DL_SPREAD_MAX_MS=2400;   // all downloads start well inside Chrome's ~5 s tap window
// Remove metadata segments from a JPEG without re-encoding: APP1 (EXIF incl. GPS, XMP), APP3-APP13 (IPTC/Photoshop), APP15, COM.
// Keeps APP0 (JFIF), APP2 (ICC colour profile) and APP14 (Adobe colour transform). Returns the input unchanged if it isn't a JPEG.
function stripJpegMeta(buf){
  const u=new Uint8Array(buf instanceof ArrayBuffer?buf:buf.buffer?buf.buffer.slice(buf.byteOffset,buf.byteOffset+buf.byteLength):buf);
  if(u.length<4||u[0]!==0xFF||u[1]!==0xD8) return u;
  const out=[u.subarray(0,2)]; let i=2;
  while(i+4<=u.length){
    if(u[i]!==0xFF) return u;                       // not a marker where one should be: leave the file alone
    const m=u[i+1];
    if(m===0xFF){ i++; continue; }                  // fill byte
    if(m===0xDA||m===0xD9){ out.push(u.subarray(i)); break; }   // start of scan: copy the rest as is
    if(m>=0xD0&&m<=0xD7||m===0x01){ out.push(u.subarray(i,i+2)); i+=2; continue; }
    const len=(u[i+2]<<8)|u[i+3]; if(len<2||i+2+len>u.length) return u;
    const drop=(m===0xE1)||(m>=0xE3&&m<=0xED)||m===0xEF||m===0xFE;
    if(!drop) out.push(u.subarray(i,i+2+len));
    i+=2+len;
  }
  const n=out.reduce((a,b)=>a+b.length,0), r=new Uint8Array(n); let o=0; out.forEach(b=>{ r.set(b,o); o+=b.length; }); return r;
}
function photoFileName(sku,i,type){ const safe=String(sku||'item').replace(/[^A-Za-z0-9-]+/g,'-').replace(/^-+|-+$/g,'')||'item';
  const ext=/png/.test(type||'')?'png':/webp/.test(type||'')?'webp':'jpg'; return `HH-${safe}-${i+1}.${ext}`; }
function cleanPhotoFile(p,sku,i){ const type=p.type||'image/jpeg'; const data=/jpe?g/.test(type)?stripJpegMeta(p.buf):p.buf;
  return new File([data],photoFileName(sku,i,type),{type}); }
// Save every photo as its own file with staggered <a download> clicks (Chrome asks "Download multiple files?" once per site).
function saveFilesStaggered(files){
  const step=files.length>1?Math.min(DL_STAGGER_MS,Math.floor(DL_SPREAD_MAX_MS/(files.length-1))):0;
  files.forEach((f,i)=>{ if(i===0) downloadBlob(f,f.name); else setTimeout(()=>downloadBlob(f,f.name),i*step); });
  return (files.length-1)*step;
}

function migrateAccounts(raw){   // any shape (old backup = undefined) -> {v:1,updatedAt,sites}

  for(const k of PKEYS){ const n=normAcctSite(k,src[k]); if(n) sites[k]=n; }

}

}

function setCloset(k){ if(!closetKeys().includes(k)) k='all'; const was=UI.closet; UI.closet=k; try{ localStorage.setItem('ctc-closet',k); }catch(e){}

// Filter tests. All closet: item-wide state. Site closet: that site's state ("Not posted" = not on this site and not sold anywhere).
const CLOSET_FILTERS={
  all:[['all','All',()=>true],['unlisted','Not posted',(it,x)=>x.unlisted],['listed','Listed',(it,x)=>x.listed&&!x.sold],['sold','Sold',(it,x)=>x.sold],['delist','\u26a0 Needs delisting',(it,x)=>x.needsDelist]],
  site:[['all','All',()=>true],['none','Not posted',(it,x,s)=>s==='none'&&!x.sold],['listed','Listed',(it,x,s)=>s==='listed'],['sold','Sold',(it,x,s)=>s==='sold'],['delist','\u26a0 Delist here',(it,x,s)=>s==='listed'&&x.sold]],
};
function closetFilters(c){ return CLOSET_FILTERS[c==='all'?'all':'site']; }
function closetCount(c,f){ const F=closetFilters(c).find(x=>x[0]===f); return F?ITEMS.filter(it=>F[2](it,st(it),c==='all'?null:siteState(it,c))).length:0; }
const SORTS={new:(a,b)=>(b.createdAt||0)-(a.createdAt||0), old:(a,b)=>(a.createdAt||0)-(b.createdAt||0), phigh:(a,b)=>(b.price||0)-(a.price||0), plow:(a,b)=>(a.price||0)-(b.price||0),
  az:(a,b)=>(buildTitle(a,80)||'').localeCompare(buildTitle(b,80)||'',undefined,{sensitivity:'base',numeric:true})||(a.sku||'').localeCompare(b.sku||'')};
function closetList(c,f,q,sort){ const F=closetFilters(c).find(x=>x[0]===f)||closetFilters(c)[0]; q=(q||'').trim().toLowerCase();

/* ---------- Draft with AI (Hanger Hustle Plus) ----------
   Fills ONLY empty boxes (never what she typed), then shows tap-to-answer question cards. Server contract: /workspace/hh-ai-server/DEPLOY.md */
const AI_TEXT=['brand','size','color','material','keywords','flaws','pit','length','waist','inseam','aiTitle','aiDesc'], AI_SELECT=['type','era','condition'];
const AI_LABEL={brand:'brand',type:'item type',era:'era',condition:'condition',size:'size',color:'color',material:'material',keywords:'style keywords',flaws:'flaws',pit:'pit to pit',length:'length',waist:'waist',inseam:'inseam',aiTitle:'title',aiDesc:'description',price:'price'};
const AI_NOT_SURE=/not sure|unsure|don.?t know|no idea|can.?t tell|skip|no tag|no label|unknown|i.?ll check|measure later/i;
function aiField(n){ return document.querySelector(`#form [name="${n}"]`); }
// A select counts as empty only on a new item she hasn't changed yet (the defaults are placeholders).
function aiIsEmpty(n){ const el=aiField(n); if(!el) return false; if(AI_SELECT.includes(n)) return !EDIT.item && !EDIT.touched.has(n); return !el.value.trim(); }
function aiSet(n,val){ const el=aiField(n); if(!el||val==null||val==='') return false; el.value=val; el.classList.add('aifill'); EDIT.aiFilled.add(n); if(n==='aiTitle'||n==='aiDesc') $('#aiWords').style.display='block'; return true; }
function aiSetupForm(){
  EDIT.touched=new Set(); EDIT.aiFilled=new Set(); EDIT.aiBusy=false;
  const f=$('#form'), mark=e=>{ const n=e.target&&e.target.name; if(!n) return; EDIT.touched.add(n); if(EDIT.aiFilled.delete(n)) e.target.classList.remove('aifill'); };

  $('#aiBtn').addEventListener('click',()=>aiDraft());
}
function aiMsg(html,kind=''){ $('#aiOut').innerHTML=html?`<div class="aimsg ${kind}">${html}</div>`:''; }
function aiQuotaLine(q){ return q&&Number.isFinite(+q.remaining)&&Number.isFinite(+q.cap)?`<span class="aiquota" id="aiQuota">${+q.remaining} of ${+q.cap} drafts left this month</span>`:''; }
function aiResetDate(iso){ const d=new Date(iso); return isNaN(d)?'the 1st of next month':d.toLocaleDateString(undefined,{month:'long',day:'numeric',timeZone:'UTC'}); }
// Resize for the AI: <=768px JPEG and <=AI_IMG_MAX_BYTES (server refuses >300 KB). Returns base64 without the data: prefix.
async function aiPrepPhoto(blob){
  for(const px of [AI_IMG_PX,640,512,400]) for(const q of [0.82,0.7,0.6,0.5]){
    const b=await resizeImage(blob,px,q);
    if(b.size<=AI_IMG_MAX_BYTES){ const d=await blobToDataURL(b); return {data:d.slice(d.indexOf(',')+1), bytes:b.size}; }
  }
  throw new Error('photo_too_big');
}
function aiHints(){
  const h={}, map={brand:'brand',size:'size',color:'color',material:'material',flaws:'flaws',pit:'pit',length:'length',waist:'waist'};
  for(const [n,k] of Object.entries(map)){ const el=aiField(n); if(el&&el.value.trim()&&!EDIT.aiFilled.has(n)) h[k]=el.value.trim().slice(0,200); }
  for(const n of AI_SELECT){ if(!aiIsEmpty(n)&&!EDIT.aiFilled.has(n)) h[n]=aiField(n).value; }
  return h;
}
// Sign in for AI: quiet refresh for the account she already picked, else Google's button (account chooser).
async function aiIdToken(){
  if(IdAuth.valid()) return IdAuth.cred;
  if(IdAuth.hint()){ try{ return await IdAuth.silent(); }catch(e){} }
  aiMsg(`<b>Sign in with Google to use AI drafts.</b> Pick the Google account you want to use. Then the draft starts by itself.`);
  try{ return await IdAuth.button($('#aiGsi')); } finally { $('#aiGsi').innerHTML=''; }
}
const AI_ERR={
  401:()=>`<b>Please sign in with Google again.</b> Your sign-in ran out. Tap <b>Draft with AI</b> again to sign in.`,
  402:()=>`<b>AI drafts are part of Hanger Hustle Plus.</b> Plus isn\u2019t turned on for this account yet. You can still fill in the item yourself, just like always.`,
  403:()=>`<b>AI drafts only work in the Hanger Hustle app</b> at app.hangerhustle.com.`,
  413:()=>`<b>A photo was too big to send.</b> Try again with fewer photos, or different ones.`,
  400:()=>`<b>The AI couldn\u2019t read these photos.</b> Try different photos (JPEG or PNG work best).`,
  503:()=>`<b>AI drafts are paused for now.</b> Please try again later. Your item is safe, and you can keep filling it in yourself.`,
  502:()=>`<b>The AI couldn\u2019t write this one.</b> Please tap Draft with AI to try again. This one didn\u2019t count against your drafts.`,
};
function aiErrorHTML(status,body){
  if(status===429){
    if(body&&body.error==='slow_down'){ const s=Math.max(5,Math.min(600,+body.retryAfter||60)); return `<b>Whoa, that\u2019s a lot of drafts in a row.</b> Please wait about ${s>=90?Math.round(s/60)+' minutes':s+' seconds'}, then try again.`; }
    const q=body&&body.quota||{}; return `<b>You\u2019ve used all ${+q.cap||300} AI drafts for this month.</b> They come back on ${esc(aiResetDate(q.resetsAt))}. You can still fill in items yourself.`;
  }
  return (AI_ERR[status]||(()=>`<b>Something went wrong (error ${+status||'?'}).</b> Please try again in a minute.`))();
}
async function aiDraft(){
  if(EDIT.aiBusy) return;
  const btn=$('#aiBtn');
  if(!EDIT.photos.length){ aiMsg(`<b>Add a photo first.</b> Take a photo or pick one from your gallery, then tap Draft with AI.`,'err'); return; }
  EDIT.aiBusy=true; btn.disabled=true; $('#aiQs').innerHTML='';
  try{
    let tok;
    try{ tok=await aiIdToken(); }
    catch(e){ aiMsg(`<b>Not signed in.</b> ${esc(e.message||'Google sign-in did not finish.')} Tap Draft with AI to try again.`,'err'); return; }
    aiMsg(`<span class="aispin" aria-hidden="true"></span><b>Writing your draft\u2026</b> This takes about 10 seconds.`);
    let images;
    try{ images=[]; for(const p of EDIT.photos.slice(0,AI_MAX_PHOTOS)){ const r=await aiPrepPhoto(p.blob); images.push({data:r.data}); } }
    catch(e){ aiMsg(AI_ERR[413](),'err'); return; }
    let r, body=null;
    try{
      const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),AI_TIMEOUT_MS);
      try{ r=await fetch(AI_URL+'/draft',{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify({images,hints:aiHints()}),signal:ctl.signal}); }
      finally{ clearTimeout(t); }
      try{ body=await r.json(); }catch(e){ body=null; }
    }catch(e){ aiMsg(`<b>Couldn\u2019t reach the AI.</b> Check your internet connection and try again.`,'err'); return; }
    if(r.status===401){ IdAuth.cred=null; IdAuth.exp=0; }
    if(!r.ok||!body||!body.draft){ aiMsg(aiErrorHTML(r.ok?502:r.status,body)+(body&&body.quota?aiQuotaLine(body.quota):''),'err'); return; }
    aiApply(body);
  } finally { EDIT.aiBusy=false; btn.disabled=false; }
}
function aiApply(res){
  const d=res.draft||{}, filled=[], unk=v=>!v||/^unknown$/i.test(String(v).trim());
  const tryFill=(n,val)=>{ if(aiIsEmpty(n)&&aiSet(n,val)) filled.push(AI_LABEL[n]); };
  if(!unk(d.brand)&&/visible/.test(d.brand_evidence||'')) tryFill('brand',d.brand);
  if(TYPES.includes(d.type)) tryFill('type',d.type);
  if(ERAS.includes(d.era)) tryFill('era',d.era_confidence==='low'?'Unknown':d.era);
  if(CONDITIONS.some(c=>c[0]===d.condition)) tryFill('condition',d.condition);
  if(!unk(d.size)) tryFill('size',d.size);
  if(!unk(d.color)) tryFill('color',d.color);
  if(!unk(d.material)) tryFill('material',d.material);
  if(Array.isArray(d.keywords)&&d.keywords.length) tryFill('keywords',d.keywords.join(', '));
  if(Array.isArray(d.flaws_seen)&&d.flaws_seen.length) tryFill('flaws',d.flaws_seen.join('; '));
  if(d.title) tryFill('aiTitle',cleanTitle(d.title));
  if(d.description) tryFill('aiDesc',cleanText(d.description));
  let priceHTML='';
  const pr=d.price; if(pr&&Number.isFinite(+pr.low)&&Number.isFinite(+pr.high)){ const mid=Math.round((+pr.low+ +pr.high)/2);
    priceHTML=`<br>AI price guess: <b>$${+pr.low}\u2013$${+pr.high}</b>${pr.reason?` (${esc(pr.reason)})`:''}. ${aiIsPriceEmpty()?`<button type="button" class="btn sm" id="aiUsePrice" data-p="${mid}">Use $${mid}</button>`:''}`; }
  const kept=[...AI_TEXT,...AI_SELECT].filter(n=>!aiIsEmpty(n)&&!EDIT.aiFilled.has(n)&&aiField(n)&&(AI_SELECT.includes(n)||aiField(n).value.trim())).length;
  aiMsg(`\u2728 <b>${filled.length?`Filled ${filled.length} empty box${filled.length===1?'':'es'}:`:'Nothing to fill: every box already had something in it.'}</b> ${esc(filled.join(', '))}${filled.length?'.':''}`
    +`${kept?` Kept everything you typed.`:''} Yellow boxes came from the AI: please check them before saving.${priceHTML}${aiQuotaLine(res.quota)}`,'ok');
  const up=$('#aiUsePrice'); if(up) up.onclick=()=>{ if(aiIsPriceEmpty()){ aiSet('price',up.dataset.p); toast('Price set to $'+up.dataset.p); } up.remove(); };
  aiQuestions(Array.isArray(res.questions)?res.questions:[]);
}
function aiIsPriceEmpty(){ const el=aiField('price'); return !!el&&!el.value.trim(); }
function aiQuestions(qs){
  const box=$('#aiQs'); box.innerHTML='';
  if(!qs.length) return;
  box.innerHTML=`<p class="note" style="font-size:var(--fs-body);color:var(--ink);font-weight:600;margin:4px 0 0">A few quick questions (tap an answer):</p>`+qs.map((q,i)=>`<div class="qcard" data-q="${i}"><p class="qq">${esc(q.question)}</p>
    <div class="qo">${(q.options||[]).map((o,j)=>`<button type="button" class="chip" data-qi="${i}" data-oi="${j}">${esc(o)}</button>`).join('')}</div></div>`).join('');
  box.onclick=e=>{ const b=e.target.closest('[data-qi]'); if(!b) return; const q=qs[+b.dataset.qi], ans=q.options[+b.dataset.oi];
    const note=aiAnswer(q,ans); const card=b.closest('.qcard'); card.classList.add('done');

// A tapped answer is her choice: it fills empty or AI-filled boxes, never a box she typed in herself.
function aiAnswer(q,ans){
  const f=q.field, a=String(ans||'').trim(), can=n=>aiIsEmpty(n)||EDIT.aiFilled.has(n);
  const put=n=>{ if(!can(n)) return 'kept what you typed'; aiSet(n,a); return 'added'; };
  if(AI_NOT_SURE.test(a)){
    if(['pit','length','waist'].includes(f)){ const el=aiField(f); if(el){ try{ el.focus({preventScroll:false}); }catch(e){} } return 'fill it in when you can'; }
    return 'skipped';
  }
  if(['pit','length','waist'].includes(f)){ const m=a.match(/\d+(?:\.\d+)?/); if(!m) return 'skipped'; if(!can(f)) return 'kept what you typed'; aiSet(f,m[0]); return 'added'; }
  if(f==='size'||f==='material'||f==='brand'){
    if(/^(yes|no)\b/i.test(a)){ if(/^yes/i.test(a)){ const el=aiField(f); if(el){ try{ el.focus(); }catch(e){} } return 'type it in the '+AI_LABEL[f]+' box'; } return 'noted'; }
    return put(f); }
  if(f==='era'){ const k=a.replace(/^(?:19)?(\d0)'?s$/i,'$1s').replace(/^y2k$/i,'Y2K'); const e=ERAS.find(x=>x.toLowerCase()===k.toLowerCase()); if(!e) return 'skipped'; if(!can('era')) return 'kept what you picked'; aiSet('era',e); return 'added'; }
  if(f==='condition'){ const c=/new with tags|nwt/i.test(a)?'nwt':/very good/i.test(a)?'verygood':/excellent|like new/i.test(a)?'excellent':/\bgood\b/i.test(a)?'good':/fair|worn/i.test(a)?'fair':'';
    if(!c) return 'skipped'; if(!can('condition')) return 'kept what you picked'; aiSet('condition',c); return 'added'; }
  // flaws + other: added to Flaws / notes (appended, never replacing)
  if(f==='flaws'&&/^(no|none)\b|no flaws|no stains|no holes|perfect/i.test(a)) return 'noted';
  const el=aiField('flaws'); if(!el) return 'skipped';
  const line=f==='flaws'?a:`${q.question.replace(/\?+$/,'')}: ${a}`; el.value=el.value.trim()?el.value.trim().replace(/[;.]?$/,'; ')+line:line;
  if(!EDIT.touched.has('flaws')){ el.classList.add('aifill'); EDIT.aiFilled.add('flaws'); }
  return 'added to flaws / notes';
}

// Posting-ready text: sanitized, title cut to the site's limit. Raw textarea values are never copied as-is.
function cardListing(p){ const el=$(`.pcard[data-p="${p}"]`), P=PLATFORMS[p]; return {title:cleanTitle($('.ti',el).value,P.titleMax), desc:clip(cleanText($('.de',el).value),P.descMax), tags:$('.tg',el)?cleanTags($('.tg',el).value):''}; }
// One tap "Post to <site>" (no share sheet on Android/desktop):
//  1. save the cleaned, numbered photos as separate downloads (staggered <a download>),
//  2. copy the title as clean plain text (Depop: the description, its first line is the headline),
//  3. open the site's sell page in a new tab (Android hands the https link to the marketplace app if it's installed),
//  4. show the step card. iPhone/iPad: Safari can't save many downloads, so the photo step is the share sheet
//     (Save Images) and she opens the site from the card afterwards.
async function postFlow(p){
  const P=PLATFORMS[p], L=cardListing(p), txt=p==='depop'?L.desc:L.title, files=DETAIL.files;
  const copied=copySync(txt);                 // synchronous copy while the page still has focus
  if(IS_IOS){
    const canShare=files.length&&navigator.canShare&&navigator.share&&navigator.canShare({files});
    let ok=copied; if(!ok) ok=await copyText(txt);
    if(!canShare){ window.open(P.create,'_blank','noopener'); if(files.length) downloadPhotos(); showChecklist(p,ok,files.length?'saved':'none',true,false); cfAfterPost(p,ok); return; }
    showChecklist(p,ok,'shared',false,false); cfAfterPost(p,ok);
    try{ await navigator.share({files, title:L.title}); }catch(e){ if(e.name!=='AbortError'){ toast('Share failed \u2014 downloading instead'); downloadPhotos(); } }
    return;
  }
  let dlOk=true; try{ dlOk=localStorage.getItem(DL_OK_KEY)==='1'; }catch(e){}
  const needOpen=IS_ANDROID&&files.length>1&&!dlOk;   // first time: let her answer Chrome's one-time question before leaving the page
  let spread=0; if(files.length) spread=saveFilesStaggered(files);
  let opened=false;
  if(!needOpen){
    const go=()=>{ const w=window.open(P.create,'_blank','noopener'); opened=true; return w; };
    if(spread===0) go(); else await new Promise(r=>setTimeout(()=>{ go(); r(); },spread+120));
  }
  let ok=copied; if(!ok) ok=await copyText(txt);
  showChecklist(p,ok,files.length?'saved':'none',opened,needOpen); cfAfterPost(p,ok);
}

function copySync(text){
  const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';
  document.body.appendChild(ta); ta.focus(); ta.select(); try{ ta.setSelectionRange(0,text.length); }catch(e){}
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); return ok;
}

/* ===================== Google sign-in + Drive backup (client-side only) =====================
   - Google Identity Services *token client* gives a short-lived access token (about 1 hour). No backend.
   - Scope drive.appdata = a hidden per-app folder in HER OWN Drive. This app can't see her other files,
     and the folder doesn't show in the Drive UI (Drive > Settings > Manage apps shows it).
   - Layout in appDataFolder:
       closet-to-cash-inventory.json  -> {format,version,updatedAt,contentHash,skuCounter,items[],photos[],tombstones{}}
                                          (items without thumbnails; photos[] = {id,itemId,idx,hash,type})
       photo-<photoId>.jpg            -> one file per photo, appProperties {kind:'photo',photoId,itemId,hash}
   - Backup = list folder, read cloud inventory, merge (newest updatedAt wins per item, cloud-only items kept,
     deleted items dropped via tombstones), upload only photos whose id/hash isn't in the cloud yet,
     delete cloud photos no longer referenced, write inventory. Backup never changes local data.
   - Restore = explicit, confirmed, additive: adds cloud-only items, replaces local items only where the
     cloud copy is newer (after confirm), never deletes local-only items. */
const AUTH_KEY='ctc-google-auth', CONSENT_KEY='ctc-google-consented';
const DRIVE_API='https://www.googleapis.com/drive/v3', DRIVE_UPLOAD='https://www.googleapis.com/upload/drive/v3';
const DRIVE_INV_NAME='closet-to-cash-inventory.json';
class AuthNeeded extends Error{ constructor(m){ super(m||'Google sign-in needed'); this.name='AuthNeeded'; } }

const Auth = {
  token:null, exp:0, profile:null, silentTried:false, needConsent:false,
  enabled(){ return !!GOOGLE_CLIENT_ID; },
  load(){ try{ const s=JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); if(s){ this.token=s.token; this.exp=s.exp||0; this.profile=s.profile||null; } }catch(e){} },
  save(){ try{ localStorage.setItem(AUTH_KEY,JSON.stringify({token:this.token,exp:this.exp,profile:this.profile})); }catch(e){} },
  signedIn(){ return this.enabled() && !!this.profile; },
  valid(){ return !!this.token && Date.now() < this.exp-60000; },
  setToken(t,expiresIn){ this.token=t; this.exp=Date.now()+(+expiresIn||3600)*1000; this.silentTried=false; this.save(); },
  loadGis(){
    if(window.google&&google.accounts&&google.accounts.oauth2) return Promise.resolve();
    if(this._gisP) return this._gisP;
    return this._gisP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.async=true;
      s.onload=()=>res(); s.onerror=()=>{ this._gisP=null; rej(new Error('Could not load Google sign-in (are you offline?)')); }; document.head.appendChild(s); });
  },
  /* Account choice rules (Michael, 2026-10-21 6:44 PM CT):
     - Every sign-in she starts shows Google's account chooser (prompt 'select_account'), plus 'consent' only for the
       first grant of drive.appdata on this device or after she declined it.
     - Quiet token refresh uses prompt '' + login_hint = the saved email, and the returned account is checked
       against that email; a different account is rejected (token revoked), never switched to silently. */
  consentKnown(){ return localStorage.getItem(CONSENT_KEY)==='1'; },
  signInPrompt(){ return (this.needConsent||!this.consentKnown()) ? 'select_account consent' : 'select_account'; },
  async userinfo(tok){
    const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+tok}});
    if(!r.ok) throw new Error('Could not read your Google profile ('+r.status+')');
    return r.json();
  },
  async request(prompt='',{hint,expectEmail}={}){
    await this.loadGis();
    return new Promise((res,rej)=>{
      let done=false; const fin=(f,v)=>{ if(!done){ done=true; f(v); } };
      const cfg={client_id:GOOGLE_CLIENT_ID, scope:GOOGLE_SCOPES,
        callback:async r=>{ if(r.error) return fin(rej,new AuthNeeded(r.error_description||r.error));
          if(google.accounts.oauth2.hasGrantedAllScopes && !google.accounts.oauth2.hasGrantedAllScopes(r,'https://www.googleapis.com/auth/drive.appdata')){ this.needConsent=true; return fin(rej,new AuthNeeded('Please allow access to the app folder in Google Drive so backups can work (tap Sign in again).')); }
          if(expectEmail){
            let u=null; try{ u=await this.userinfo(r.access_token); }catch(e){ return fin(rej,new AuthNeeded(e.message)); }
            if(!u.email||u.email.toLowerCase()!==expectEmail.toLowerCase()){
              try{ google.accounts.oauth2.revoke(r.access_token,()=>{}); }catch(e){}
              return fin(rej,new AuthNeeded(`Google answered with a different account (${u.email||'unknown'}). Still signed in as ${expectEmail}: tap \u201cBack up now\u201d to reconnect, or use Switch account.`)); }
          }
          this.setToken(r.access_token,r.expires_in); fin(res,r.access_token); },
        error_callback:e=>fin(rej,new AuthNeeded(e&&e.type==='popup_closed'?'Sign-in window closed':'Google sign-in could not open ('+((e&&(e.message||e.type))||'blocked')+')'))};
      if(hint) cfg.login_hint=hint;
      const client=google.accounts.oauth2.initTokenClient(cfg);
      client.requestAccessToken({prompt});
      setTimeout(()=>fin(rej,new AuthNeeded('Google sign-in timed out')),120000);
    });
  },
  // Token for the account she already chose. interactive=true only from a tap (popups need a user gesture).
  async getToken(interactive=false){
    if(this.valid()) return this.token;
    if(!this.enabled()) throw new AuthNeeded('Google backup is not configured');
    if(!this.profile) throw new AuthNeeded('Not signed in to Google');
    const o={hint:this.profile.email, expectEmail:this.profile.email};
    if(interactive) return this.request('',o);
    if(!this.silentTried && document.visibilityState==='visible'){ this.silentTried=true; try{ return await this.request('',o); }catch(e){ if(/different account/.test(e.message)) throw e; } }
    throw new AuthNeeded('Google sign-in expired \u2014 tap \u201cBack up now\u201d to reconnect');
  },
  // Sign-in she started: always the account chooser.
  async signIn(){
    const tok=await this.request(this.signInPrompt());
    const u=await this.userinfo(tok);
    this.profile={name:u.name||u.email,email:u.email,picture:u.picture||''}; this.needConsent=false; this.save();
    try{ localStorage.setItem(CONSENT_KEY,'1'); }catch(e){}
  },
  clearSession(){ this.token=null; this.exp=0; this.profile=null; this.silentTried=false; try{ localStorage.removeItem(AUTH_KEY); }catch(e){} },
  signOut(){
    try{ if(this.token&&window.google&&google.accounts&&google.accounts.oauth2) google.accounts.oauth2.revoke(this.token,()=>{}); }catch(e){}
    this.clearSession(); try{ IdAuth.signOut(); }catch(e){}
  },
  // Switch: drop the current token (not revoked, so picking the same account again can't race a revoke) and reopen the chooser.
  // If she closes the chooser, the previous account stays signed in.
  async switchAccount(){ const prev={token:this.token,exp:this.exp,profile:this.profile}; this.clearSession();
    try{ await this.signIn(); }catch(e){ Object.assign(this,prev); this.save(); e.restored=!!prev.profile; throw e; }
    return {prev:prev.profile,now:this.profile}; }
};

/* ---- Sign in with Google for AI drafts (ID token) ----
   The Drive sign-in above (token client) only gives an *access* token. The AI server needs an *ID token* (JWT, about 1 hour)
   from Sign in with Google (google.accounts.id), same client id. Account rules (Michael, 2026-10-21 6:44 PM CT) kept:
   - The first sign-in (and Switch) is Google's own "Sign in with Google" button: its window shows the account chooser.
   - Quiet refresh only for the account she already picked (auto_select + login_hint), and the answer must be that same
     account; anything else falls back to the button. The ID token stays in memory only (never saved). */
const AI_ACCT_KEY='ctc-ai-account';
const IdAuth = {
  cred:null, exp:0, email:'',
  hint(){ try{ return localStorage.getItem(AI_ACCT_KEY)||''; }catch(e){ return ''; } },
  valid(){ return !!this.cred && Date.now() < this.exp-5*60000; },
  decode(jwt){ const p=String(jwt||'').split('.')[1]||''; const b=atob(p.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(p.length/4)*4,'='));
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))); },
  accept(cred,expectEmail){
    let c; try{ c=this.decode(cred); }catch(e){ throw new AuthNeeded('Google sign-in answer could not be read. Please try again.'); }
    if(c.aud!==GOOGLE_CLIENT_ID) throw new AuthNeeded('Google sign-in was for a different app. Please try again.');
    if(expectEmail && String(c.email||'').toLowerCase()!==expectEmail.toLowerCase()) throw new AuthNeeded('Google answered with a different account.');
    this.cred=cred; this.exp=(+c.exp||0)*1000||Date.now()+3600000; this.email=c.email||'';
    try{ if(this.email) localStorage.setItem(AI_ACCT_KEY,this.email); }catch(e){}
    return cred;
  },
  init(cb,hint){ const cfg={client_id:GOOGLE_CLIENT_ID, callback:cb, auto_select:!!hint, cancel_on_tap_outside:false, itp_support:true, use_fedcm_for_prompt:true, context:'signin'};
    if(hint) cfg.login_hint=hint; google.accounts.id.initialize(cfg); },
  // Quiet refresh for the account she already picked. Rejects if Google can't do it without asking.
  async silent(){
    const hint=this.hint(); if(!hint) throw new AuthNeeded('Not signed in for AI drafts yet');
    await Auth.loadGis();
    return new Promise((res,rej)=>{
      let done=false; const fin=(f,v)=>{ if(!done){ done=true; clearTimeout(t); if(f===rej){ try{ google.accounts.id.cancel(); }catch(e){} } f(v); } };
      this.init(r=>{ try{ fin(res,this.accept(r&&r.credential,hint)); }catch(e){ fin(rej,e); } },hint);
      try{ google.accounts.id.prompt(n=>{ try{
        if((n.isNotDisplayed&&n.isNotDisplayed())||(n.isSkippedMoment&&n.isSkippedMoment())||(n.isDismissedMoment&&n.isDismissedMoment()&&n.getDismissedReason&&n.getDismissedReason()!=='credential_returned'))
          fin(rej,new AuthNeeded('Quiet sign-in not available')); }catch(e){} }); }catch(e){ fin(rej,new AuthNeeded('Quiet sign-in not available')); }
      const t=setTimeout(()=>fin(rej,new AuthNeeded('Google sign-in timed out')),20000);
    });
  },
  // Google's own button (opens the account chooser). Resolves when she has picked an account.
  async button(el){
    await Auth.loadGis();
    return new Promise((res,rej)=>{
      this.init(r=>{ try{ res(this.accept(r&&r.credential,'')); }catch(e){ rej(e); } },'');
      el.innerHTML=''; google.accounts.id.renderButton(el,{type:'standard',theme:'filled_blue',size:'large',text:'signin_with',shape:'pill',logo_alignment:'left',width:Math.max(200,Math.min(340,el.clientWidth||300))});
    });
  },
  signOut(){ this.cred=null; this.exp=0; this.email=''; try{ localStorage.removeItem(AI_ACCT_KEY); }catch(e){} try{ if(window.google&&google.accounts&&google.accounts.id) google.accounts.id.disableAutoSelect(); }catch(e){} }
};

/* ---- Drive REST v3 helpers ---- */
async function gfetch(url,opts={},retry=true){
  const tok=await Auth.getToken(!!opts.interactive);
  const r=await fetch(url,{method:opts.method||'GET',body:opts.body,headers:{...(opts.headers||{}),Authorization:'Bearer '+tok}});
  if(r.status===401&&retry){ Auth.token=null; Auth.exp=0; Auth.silentTried=false; Auth.save(); return gfetch(url,opts,false); }
  if(!r.ok){ let msg=r.status+' '+(r.statusText||''); try{ const j=await r.json(); msg=(j.error&&j.error.message)||msg; }catch(e){}
    const err=new Error('Google Drive: '+msg); err.status=r.status; if(r.status===401) throw new AuthNeeded('Google sign-in expired \u2014 tap \u201cBack up now\u201d to reconnect'); throw err; }
  return r;
}
async function driveListAll(o){
  const out=[]; let pt='';
  do{ const r=await gfetch(`${DRIVE_API}/files?spaces=appDataFolder&pageSize=1000&fields=${encodeURIComponent('nextPageToken,files(id,name,appProperties,modifiedTime,size)')}${pt?'&pageToken='+encodeURIComponent(pt):''}`,o);
      const j=await r.json(); out.push(...(j.files||[])); pt=j.nextPageToken||''; }while(pt);
  return out;
}
function multipartBody(meta,data,mime){
  const b='ctc'+Math.random().toString(36).slice(2)+Date.now().toString(36);
  return {type:`multipart/related; boundary=${b}`, body:new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${mime}\r\n\r\n`, data, `\r\n--${b}--`])};
}
async function driveUpload({id,name,mime,data,appProperties},o={}){
  const meta=id?{name,appProperties}:{name,parents:['appDataFolder'],appProperties};
  const {body,type}=multipartBody(meta,data,mime);
  const r=await gfetch(`${DRIVE_UPLOAD}/files${id?'/'+encodeURIComponent(id):''}?uploadType=multipart&fields=id,name,appProperties`,{...o,method:id?'PATCH':'POST',headers:{'Content-Type':type},body});
  return r.json();
}
const driveDownload=(id,o)=>gfetch(`${DRIVE_API}/files/${encodeURIComponent(id)}?alt=media`,o);
const driveDelete=(id,o)=>gfetch(`${DRIVE_API}/files/${encodeURIComponent(id)}`,{...o,method:'DELETE'}).catch(e=>{ if(e.status!==404) throw e; });

async function hashBuf(buf){
  try{ if(window.crypto&&crypto.subtle){ const h=await crypto.subtle.digest('SHA-256',buf); return Array.from(new Uint8Array(h).slice(0,16),b=>b.toString(16).padStart(2,'0')).join(''); } }catch(e){}
  const u=new Uint8Array(buf); let h=0x811c9dc5; for(let i=0;i<u.length;i++){ h^=u[i]; h=Math.imul(h,16777619)>>>0; } return 'fnv'+h.toString(16)+'-'+u.length;
}
function hashStr(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h.toString(16)+'-'+s.length; }

/* ---- pure planning functions (unit-tested) ---- */
const stripItem = it => { const c={...it}; delete c.thumb; return c; };
function planBackup(local,remote,remotePhotoFiles){
  // local: {items,photos,tomb,sku}; remote: cloud inventory or null; remotePhotoFiles: Map photoId -> Drive file
  const tomb={...((remote&&remote.tombstones)||{})};
  for(const [k,v] of Object.entries(local.tomb||{})) tomb[k]=Math.max(tomb[k]||0,v);
  const win=new Map();   // id -> {item, src:'local'|'remote'}
  for(const it of (remote&&remote.items)||[]) win.set(it.id,{item:it,src:'remote'});
  for(const it of local.items){ const r=win.get(it.id); if(!r||(it.updatedAt||0)>=(r.item.updatedAt||0)) win.set(it.id,{item:it,src:'local'}); }
  for(const [id,t] of Object.entries(tomb)){ const w=win.get(id); if(w&&(w.item.updatedAt||0)<=t) win.delete(id); }
  const photos=[], upload=[];
  for(const [id,w] of win){
    if(w.src==='local') for(const p of local.photos.filter(p=>p.itemId===id)){
      photos.push({id:p.id,itemId:id,idx:p.idx,hash:p.hash,type:p.type||'image/jpeg'});
      const f=remotePhotoFiles.get(p.id); if(!f||!f.appProperties||f.appProperties.hash!==p.hash) upload.push(p);
    } else for(const p of ((remote&&remote.photos)||[]).filter(p=>p.itemId===id)) photos.push(p);
  }
  const keep=new Set(photos.map(p=>p.id));
  const deleteFiles=[...remotePhotoFiles.entries()].filter(([pid])=>!keep.has(pid)).map(([,f])=>f);
  const items=[...win.values()].map(w=>stripItem(w.item)).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  photos.sort((a,b)=>a.id<b.id?-1:1);
  const skuCounter=Math.max(local.sku||0,(remote&&remote.skuCounter)||0);
  // accounts (usernames/shop links): newest updatedAt wins; only hashed/stored once she has used My accounts
  const la=migrateAccounts(local.accounts), ra=migrateAccounts(remote&&remote.accounts), accounts=ra.updatedAt>la.updatedAt?ra:la;
  const contentHash=hashStr(JSON.stringify(accounts.updatedAt?{items,photos,tomb,skuCounter,accounts}:{items,photos,tomb,skuCounter}));
  const unchanged=!!remote&&remote.contentHash===contentHash&&!upload.length&&!deleteFiles.length;
  return {inventory:{format:'closet-to-cash-drive',version:1,app:APP_NAME,updatedAt:Date.now(),contentHash,skuCounter,items,photos,tombstones:tomb,...(accounts.updatedAt?{accounts}:{})},upload,deleteFiles,unchanged,
    cloudOnly:items.filter(i=>!local.items.some(l=>l.id===i.id)).length};
}
function planRestore(localItems,remote){
  const res={add:[],update:[],keepLocal:[],same:0};
  const byId=new Map(localItems.map(i=>[i.id,i])), bySku=new Map(localItems.filter(i=>i.sku).map(i=>[i.sku,i]));
  for(const r of (remote&&remote.items)||[]){
    const l=byId.get(r.id)||(r.sku&&bySku.get(r.sku));
    if(!l) res.add.push(r);
    else if((r.updatedAt||0)>(l.updatedAt||0)) res.update.push({remote:r,local:l});
    else if((r.updatedAt||0)<(l.updatedAt||0)) res.keepLocal.push(l);
    else res.same++;
  }
  return res;
}

/* ---- sync state, auto backup ---- */
const SYNC={dirty:false,running:false,again:false,timer:null,state:'idle',msg:'',last:null};
function setSync(state,msg){ SYNC.state=state; SYNC.msg=msg||''; updateSyncUI(); }
function autoBackupOn(){ return Auth.signedIn() && localStorage.getItem('ctc-auto-backup')!=='off'; }
function markDirty(){
  if(SYNC.suspend) return;
  SYNC.dirty=true;
  if(!autoBackupOn()) return;
  clearTimeout(SYNC.timer); setSync('pending','Changes waiting to back up\u2026');
  SYNC.timer=setTimeout(()=>backupNow({reason:'auto'}),AUTO_BACKUP_DELAY_MS);
}
function flushOnHide(){ if(document.visibilityState==='hidden'&&SYNC.dirty&&autoBackupOn()){ clearTimeout(SYNC.timer); backupNow({reason:'hide'}); } }

async function backupNow({reason='manual'}={}){
  if(!Auth.signedIn()) return;
  if(SYNC.running){ SYNC.again=true; return; }
  SYNC.running=true; clearTimeout(SYNC.timer); SYNC.dirty=false;
  const o={interactive:reason==='manual'};
  setSync('running','Backing up to Google Drive\u2026');
  try{
    const files=await driveListAll(o);
    const invFile=files.find(f=>f.name===DRIVE_INV_NAME);
    const rp=new Map(); files.filter(f=>f.appProperties&&f.appProperties.kind==='photo').forEach(f=>rp.set(f.appProperties.photoId,f));
    const remote=invFile?await (await driveDownload(invFile.id,o)).json():null;
    const local={items:await getAllItems(),photos:await getAllPhotos(),tomb:(await getMeta('tombstones'))||{},sku:(await getMeta('sku'))||0,accounts:(await getMeta('accounts'))||null};
    for(const p of local.photos) if(!p.hash){ p.hash=await hashBuf(p.buf); await reqP(os('photos','readwrite').put(p)); }
    const plan=planBackup(local,remote,rp);
    let up=0;
    for(const p of plan.upload){ setSync('running',`Uploading photo ${++up} of ${plan.upload.length}\u2026`); const f=rp.get(p.id);
      await driveUpload({id:f&&f.id,name:`photo-${p.id}.jpg`,mime:p.type||'image/jpeg',data:new Blob([p.buf],{type:p.type||'image/jpeg'}),appProperties:{kind:'photo',photoId:p.id,itemId:p.itemId,hash:p.hash}},o); }
    if(!plan.unchanged) await driveUpload({id:invFile&&invFile.id,name:DRIVE_INV_NAME,mime:'application/json',data:JSON.stringify(plan.inventory),appProperties:{kind:'inventory'}},o);
    for(const f of plan.deleteFiles) await driveDelete(f.id,o);
    const photoCount=plan.inventory.photos.length;
    SYNC.last={at:Date.now(),uploaded:plan.upload.length,skipped:photoCount-plan.upload.length,deleted:plan.deleteFiles.length,items:plan.inventory.items.length,photos:photoCount,cloudOnly:plan.cloudOnly,unchanged:plan.unchanged};
    await setMeta('lastBackup',SYNC.last);
    setSync('ok','');
    return SYNC.last;
  }catch(err){
    console.warn('Backup failed',err); SYNC.dirty=true;
    setSync(err instanceof AuthNeeded?'auth':'error',err.message||String(err));
    if(reason==='manual') throw err;
  }finally{
    SYNC.running=false;
    if(SYNC.again){ SYNC.again=false; if(autoBackupOn()) markDirty(); }
  }
}

async function restoreFromDrive({confirmFn=confirm}={}){
  const o={interactive:true};
  if(SYNC.running){ toast('A backup is running \u2014 try again in a moment'); return {done:false,reason:'busy'}; }
  SYNC.running=true; clearTimeout(SYNC.timer);   // no backup may run while restoring
  setSync('running','Checking your Google Drive backup\u2026');
  try{
    const files=await driveListAll(o), invFile=files.find(f=>f.name===DRIVE_INV_NAME);
    if(!invFile){ setSync('ok',''); toast('No Google Drive backup found yet'); return {done:false,reason:'none'}; }
    const remote=await (await driveDownload(invFile.id,o)).json();
    const local=await getAllItems(), plan=planRestore(local,remote);
    const accNew=!!remote.accounts&&migrateAccounts(remote.accounts).updatedAt>ACCT.updatedAt;   // old backups have no accounts: keep this phone's
    if(!plan.add.length&&!plan.update.length&&!accNew){ setSync('ok',''); toast('This device already has everything in your backup'); return {done:false,reason:'uptodate',plan}; }
    const msg=`Restore from Google Drive?\n\n\u2022 ${plan.add.length} item(s) will be added\n\u2022 ${plan.update.length} item(s) are newer in Drive and will REPLACE the copy on this phone${plan.update.length?' ('+plan.update.slice(0,5).map(u=>u.local.sku).join(', ')+(plan.update.length>5?'\u2026':'')+')':''}\n\u2022 ${plan.keepLocal.length} item(s) are newer here and will be kept${accNew?'\n\u2022 Your My accounts list (usernames, shop links) is newer in Drive and will replace this phone\u2019s':''}\n\nItems that are only on this phone are never deleted.`;
    if(!confirmFn(msg)){ setSync('ok',''); return {done:false,reason:'cancelled',plan}; }
    const fileByPhoto=new Map(files.filter(f=>f.appProperties&&f.appProperties.kind==='photo').map(f=>[f.appProperties.photoId,f]));
    const tomb=(await getMeta('tombstones'))||{};
    SYNC.suspend=true;
    let n=0; const jobs=[...plan.add.map(r=>({r,targetId:r.id})),...plan.update.map(u=>({r:u.remote,targetId:u.local.id,old:u.local}))];
    for(const {r,targetId} of jobs){
      setSync('running',`Restoring item ${++n} of ${jobs.length}\u2026`);
      const refs=(remote.photos||[]).filter(p=>p.itemId===r.id).sort((a,b)=>a.idx-b.idx);
      const existing=await getPhotos(targetId), exById=new Map(existing.map(p=>[p.id,p])), keepIds=new Set();
      let cover=null;
      for(const ref of refs){
        let rec=exById.get(ref.id);
        if(!rec||(rec.hash&&ref.hash&&rec.hash!==ref.hash)){
          const f=fileByPhoto.get(ref.id); if(!f) continue;
          const buf=await (await driveDownload(f.id,o)).arrayBuffer();
          rec={id:ref.id,itemId:targetId,idx:ref.idx,type:ref.type||'image/jpeg',buf,hash:ref.hash};
        } else rec={...rec,itemId:targetId,idx:ref.idx};
        await reqP(os('photos','readwrite').put(rec)); keepIds.add(rec.id); if(!cover) cover=rec;
      }
      for(const p of existing) if(!keepIds.has(p.id)) await delPhoto(p.id);
      const it=migrateItem({...r,id:targetId,photoCount:keepIds.size});
      it.thumb=cover?await makeThumb(photoBlob(cover)):'';
      await reqP(os('items','readwrite').put(it)); delete tomb[targetId];
    }
    await setMeta('tombstones',tomb);
    if((remote.skuCounter||0)>((await getMeta('sku'))||0)) await setMeta('sku',remote.skuCounter);
    if(accNew) await applyAccounts(remote.accounts);
    SYNC.suspend=false;
    await refresh(); setSync('ok',''); toast(`Restored ${jobs.length} item(s)${accNew?' + your accounts':''} from Google Drive`);
    return {done:true,plan};
  }catch(err){ SYNC.suspend=false; setSync(err instanceof AuthNeeded?'auth':'error',err.message||String(err)); throw err; }
  finally{ SYNC.running=false; if(SYNC.dirty&&autoBackupOn()) markDirty(); }
}

/* ---- UI bits ---- */
const fmtTime = t => t ? new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : 'never';
function accountChipHTML(){
  if(!Auth.signedIn()) return Auth.enabled()?`<a class="acct" href="#/backup" id="acctChip"><span class="dot off"></span>\u2601 Sign in</a>`:'';
  const p=Auth.profile, dot={ok:'ok',idle:'ok',pending:'pend',running:'pend',error:'err',auth:'err'}[SYNC.state]||'ok';
  return `<a class="acct" href="#/backup" id="acctChip" title="Signed in as ${esc(p.email)}" aria-label="Google account ${esc(p.email)}">${p.picture?`<img src="${esc(p.picture)}" alt="" referrerpolicy="no-referrer">`:`<span class="ini">${esc((p.name||'?')[0])}</span>`}<span class="nm">${esc((p.name||'').split(' ')[0])}</span><span class="dot ${dot}"></span></a>`;
}
function updateSyncUI(){
  const chip=$('#acctSlot'); if(chip) chip.innerHTML=accountChipHTML();
  const box=$('#gStatus'); if(!box) return;
  const L=SYNC.last;
  let h='';
  if(SYNC.state==='running'||SYNC.state==='pending') h=`<div class="gs pend">\u23f3 ${esc(SYNC.msg)}</div>`;
  else if(SYNC.state==='error'||SYNC.state==='auth') h=`<div class="gs err" role="alert">\u26a0 Backup problem: ${esc(SYNC.msg)}</div>`;
  h+=`<div class="gs">Last backup: <b id="lastBackup">${fmtTime(L&&L.at)}</b>${L?` \u00b7 ${L.items} items, ${L.photos} photos${L.uploaded||L.deleted?` (${L.uploaded} uploaded, ${L.skipped} unchanged${L.deleted?', '+L.deleted+' removed':''})`:' (nothing new)'}`:''}</div>`;
  if(L&&L.cloudOnly) h+=`<div class="gs pend">${L.cloudOnly} item(s) in your Drive backup aren't on this phone \u2014 tap \u201cRestore from Google Drive\u201d.</div>`;
  box.innerHTML=h;
}

const GOOGLE_G='<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>';
function bindGoogleSection(){
  const si=$('#gSignIn'); if(si&&!si.disabled) si.onclick=async()=>{ si.disabled=true; try{ await Auth.signIn(); toast('Signed in as '+Auth.profile.email); renderBackup(); updateSyncUI(); backupNow({reason:'auto'}); }catch(e){ toast(e.message); si.disabled=false; } };
  const b=$('#gBackup'); if(b) b.onclick=async()=>{ b.disabled=true; try{ const r=await backupNow({reason:'manual'}); if(r) toast(r.unchanged&&!r.uploaded?'Backup is up to date':`Backed up \u00b7 ${r.uploaded} photo(s) uploaded`); }catch(e){ toast(e.message); } b.disabled=false; };
  const r=$('#gRestore'); if(r) r.onclick=async()=>{ r.disabled=true; try{ await restoreFromDrive(); }catch(e){ toast(e.message); } r.disabled=false; };
  const a=$('#gAuto'); if(a) a.onchange=()=>{ localStorage.setItem('ctc-auto-backup',a.checked?'on':'off'); if(a.checked&&SYNC.dirty) markDirty(); };
  const sw=$('#gSwitch'); if(sw) sw.onclick=async()=>{
    const cur=Auth.profile&&Auth.profile.email;
    const msg=`Switch Google account?\n\nYou're signed in as ${cur}.\n\n\u2022 Each Google account has its own separate backup.\n\u2022 Your items stay on this phone; nothing is deleted.${SYNC.dirty?`\n\u2022 Recent changes haven't been backed up to ${cur} yet. Cancel and tap \u201cBack up now\u201d first if you want them there.`:''}\n\u2022 After you pick an account, this phone's items back up to that account too${localStorage.getItem('ctc-auto-backup')==='off'?' when you tap Back up now':''}.\n\u2022 To bring another account's items onto this phone, use \u201cRestore from Google Drive\u201d after switching.`;
    if(!confirm(msg)) return;
    sw.disabled=true; clearTimeout(SYNC.timer); SYNC.timer=null;
    try{ const r=await Auth.switchAccount(); SYNC.last=null; try{ await setMeta('lastBackup',null); }catch(e){}
      setSync('idle',''); renderBackup(); updateSyncUI(); toast(r.prev&&r.prev.email===r.now.email?`Still signed in as ${r.now.email}`:`Switched to ${r.now.email}`); if(autoBackupOn()) backupNow({reason:'auto'}); }
    catch(e){ setSync('idle',''); renderBackup(); updateSyncUI(); toast(`${e.message||'Switch cancelled'} \u2014 still signed in as ${cur}`); }
  };
  const so=$('#gSignOut'); if(so) so.onclick=()=>{ if(!confirm('Sign out of Google? Your items stay on this phone and in your Drive backup.')) return; Auth.signOut(); clearTimeout(SYNC.timer); setSync('idle',''); renderBackup(); toast('Signed out'); };
  updateSyncUI();
}
